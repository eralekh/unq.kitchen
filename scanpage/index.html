<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNQ Kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --olive: #7A8434;
      --olive-dark: #5C6330;
      --ink: #14160C;
      --paper-2: #faf9f3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--paper-2);
      color: var(--ink);
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 0;
    }

    .logo {
      max-width: 180px;
      width: 55vw;
      margin-bottom: 48px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      border-radius: 18px;
      padding: 20px 22px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }

    .btn-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.5rem;
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .btn-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1;
    }
    .btn-sub {
      font-size: 0.67rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    /* All buttons share the same style */
    .btn-menu,
    .btn-google,
    .btn-instagram {
      background: #fff;
      color: var(--ink);
      border: 1.5px solid #e8e8e2;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .btn-menu .btn-icon,
    .btn-google .btn-icon,
    .btn-instagram .btn-icon {
      background: #f4f4f0;
    }

    /* Google G SVG icon */
    .g-icon { width: 22px; height: 22px; }

    /* Instagram SVG icon */
    .ig-icon { width: 22px; height: 22px; }
  </style>
</head>
