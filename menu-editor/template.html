:root {
  --ink:#14160C;
  --ink-soft:#3D4422;
  --ink-mute:#5E6438;
  --gold:#7A8434;
  --gold-bright:#5C6330;
  --gold-dim:rgba(122,132,52,0.30);
  --gold-faint:rgba(122,132,52,0.12);
}

*,*::before,*::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body {
  background:#e8e6de;
  font-family:'Inter',Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

body {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:32px;
  min-height:100vh;
  padding:32px 16px;
}

.page {
  width:210mm;
  height:297mm;
  position:relative;
  display:flex;
  flex-direction:column;
  padding:11mm 16mm 9mm;
  color:var(--ink);
  background:#fff;
  box-shadow:0 18px 60px rgba(0,0,0,0.09);
  overflow:hidden;
}

@media(max-width:720px) {
  body {
    padding:12px 10px;
    gap:16px;
  }

.page {
    width:100%;
    height:auto;
    min-height:unset;
    padding:22px 14px 18px;
    overflow:visible;
  }
}

@page {
  size:A4 portrait;
  margin:0;
}

@media print {
  html,body {
    background:#fff;
    padding:0;
    gap:0;
  }

.page {
    box-shadow:none;
    width:210mm;
    height:297mm;
    overflow:hidden;
    page-break-after:always;
    padding:11mm 16mm 9mm;
  }

* {
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}

.frame {
  position:absolute;
  inset:8px;
  pointer-events:none;
  z-index:2;
  border:1px solid var(--gold-dim);
}

.fc {
  position:absolute;
  width:7px;
  height:7px;
  background:var(--gold);
  transform:rotate(45deg);
  opacity:0.85;
}

.fc.tl {
  top:-4px;
  left:-4px;
}

.fc.tr {
  top:-4px;
  right:-4px;
}

.fc.bl {
  bottom:-4px;
  left:-4px;
}

.fc.br {
  bottom:-4px;
  right:-4px;
}

.watermark {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:1;
  overflow:hidden;
}

.wm-text {
  font-family:'BlippoMN',serif;
  font-size:160px;
  font-weight:900;
  color:var(--ink);
  opacity:0.025;
  letter-spacing:0.26em;
  user-select:none;
  white-space:nowrap;
}

.content {
  position:relative;
  z-index:3;
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* Hero */
.pkg-hero {
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:7px 0;
  border-bottom:1px solid var(--gold-faint);
  margin-bottom:6px;
  flex-shrink:0;
}

.unq-logo {
  font-family:'BlippoMN',serif;
  font-weight:900;
  letter-spacing:0.26em;
  font-size:13px;
}

.pkg-number {
  font-size:11px;
  font-weight:600;
  letter-spacing:4px;
  text-indent:4px;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:5px;
}

.pkg-title-row {
  display:flex;
  align-items:baseline;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:2px;
}

.pkg-name {
  font-family:'Cormorant Garamond','Georgia',serif;
  font-size:32px;
  font-weight:500;
  color:var(--ink);
  letter-spacing:0.5px;
  line-height:1;
}

.pkg-at {
  font-size:20px;
  font-weight:300;
  color:var(--ink-mute);
  line-height:1;
}

.pkg-price {
  font-size:52px;
  font-weight:300;
  color:var(--ink);
  letter-spacing:-1px;
  line-height:1;
  display:flex;
  align-items:baseline;
  gap:4px;
}

.per-person {
  font-size:11px;
  font-weight:500;
  color:var(--ink-mute);
