<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNQ Kitchen — Package Editor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;}

/* ── Top bar ── */
.topbar{background:#1a1a1a;color:#e8d98a;padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
.topbar .logo{font-weight:700;font-size:15px;letter-spacing:2px;}
.topbar .sep{opacity:.3;}
nav{display:flex;gap:4px;}
nav button{background:none;border:none;color:#aaa;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;}
nav button.active{background:#e8d98a;color:#1a1a1a;}
nav button:hover:not(.active){background:rgba(232,217,138,.15);color:#e8d98a;}
.topbar-right{margin-left:auto;display:flex;gap:8px;}
.btn{padding:7px 16px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.btn-gold{background:#e8d98a;color:#1a1a1a;}
.btn-gold:hover{background:#f0e89a;}
.btn-outline{background:none;border:1px solid #555;color:#ccc;}
.btn-outline:hover{border-color:#e8d98a;color:#e8d98a;}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:3px;}
.btn-danger{background:#c0392b;color:#fff;}
.btn-danger:hover{background:#e74c3c;}
.btn-success{background:#27ae60;color:#fff;}
.btn-success:hover{background:#2ecc71;}
.btn-secondary{background:#555;color:#fff;}
.btn-secondary:hover{background:#666;}

/* ── Panels ── */
.panel{display:none;padding:20px;}
.panel.active{display:block;}

/* ── Matrix view ── */
.matrix-controls{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.matrix-controls input{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;width:220px;}
.matrix-controls select{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;}
.matrix-wrap{overflow:auto;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.1);}
table.matrix{border-collapse:collapse;width:100%;background:#fff;font-size:12px;}
table.matrix th{background:#1a1a1a;color:#e8d98a;padding:8px 10px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:10;}
table.matrix th.item-col{text-align:left;min-width:200px;position:sticky;left:0;z-index:11;}
table.matrix th.price-col{background:#2a2a1a;}
table.matrix td{padding:6px 10px;border-bottom:1px solid #eee;border-right:1px solid #f0f0f0;vertical-align:middle;}
table.matrix td.item-col{position:sticky;left:0;background:#fff;font-size:12.5px;z-index:5;}
table.matrix td.item-col.unassigned{background:#fff8e1;}
table.matrix td.price-cell{text-align:center;font-size:11px;color:#666;}
table.matrix td.check-cell{text-align:center;padding:4px 6px;min-width:80px;}
/* Checkbox cell states */
.check-cell input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#27ae60;}
.check-cell.suggest{background:#f0faf0;}
.check-cell.suggest input[type=checkbox]{accent-color:#5dba6e;}
.suggest-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#a0d8a0;margin-left:4px;vertical-align:middle;cursor:help;}
.section-divider td{background:#f8f5e8;font-weight:700;font-size:11px;color:#8a7a3a;padding:4px 10px;letter-spacing:1px;text-transform:uppercase;position:sticky;left:0;}
.unassigned-tag{display:inline-block;background:#ffeaa7;color:#6c5a00;font-size:10px;padding:1px 5px;border-radius:2px;margin-left:4px;}
.pkg-price-header{font-size:11px;color:#e8d98a;display:block;font-weight:400;}
.legend{display:flex;gap:16px;font-size:12px;margin-top:10px;align-items:center;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:4px;}
/* Section-add modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:8px;padding:20px 24px;min-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h3{font-size:15px;font-weight:700;margin-bottom:12px;}
.modal select,.modal input{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;margin-bottom:10px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}

/* ── Package builder ── */
.pkg-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.pkg-tab{padding:7px 16px;border:1px solid #ccc;border-radius:4px;cursor:pointer;font-size:13px;background:#fff;transition:all .15s;}
.pkg-tab.active{background:#1a1a1a;color:#e8d98a;border-color:#1a1a1a;}
.pkg-tab:hover:not(.active){border-color:#999;}
.builder-layout{display:grid;grid-template-columns:280px 1fr 300px;gap:14px;align-items:start;}
.card{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:14px;}
.card-title{font-size:12px;font-weight:700;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid #eee;}
.field-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
.field-row label{font-size:12px;color:#666;font-weight:600;min-width:90px;padding-top:7px;}
.field-row input,.field-row textarea,.field-row select{flex:1;padding:7px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;font-family:inherit;}
.field-row textarea{resize:vertical;min-height:60px;}
.field-row input:focus,.field-row textarea:focus{outline:none;border-color:#e8d98a;}

/* Pool panel */
.pool-panel{display:flex;flex-direction:column;gap:0;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden;}
.pool-header{padding:10px 12px;border-bottom:1px solid #eee;background:#fafafa;}
.pool-header-title{font-size:12px;font-weight:700;color:#555;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.pool-search{width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:3px;font-size:12px;margin-bottom:6px;}
.pool-search:focus{outline:none;border-color:#e8d98a;}
.pool-cat-sel{width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:3px;font-size:12px;margin-bottom:6px;}
.pool-toggle{display:flex;border:1px solid #ddd;border-radius:3px;overflow:hidden;}
.pool-toggle button{flex:1;padding:4px 6px;border:none;background:#fff;font-size:11px;cursor:pointer;font-weight:600;color:#888;transition:all .15s;}
.pool-toggle button.active{background:#1a1a1a;color:#e8d98a;}
.pool-list{overflow-y:auto;max-height:calc(100vh - 340px);min-height:200px;}
.pool-cat-header{padding:5px 12px;font-size:10px;font-weight:700;letter-spacing:1px;color:#9a8a5a;background:#fdf8ee;text-transform:uppercase;border-top:1px solid #f0ead0;position:sticky;top:0;z-index:2;}
.pool-item{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid #f5f5f5;cursor:grab;user-select:none;transition:background .1s;}
.pool-item:hover{background:#fdf8ee;}
.pool-item.in-pkg{opacity:.45;}
.pool-item.in-pkg .pool-check{color:#27ae60;}
.pool-item-name{flex:1;font-size:12px;color:#333;}
.pool-item-price{font-size:11px;color:#999;white-space:nowrap;}
.pool-check{font-size:12px;color:transparent;width:14px;flex-shrink:0;}
.pool-dropzone{padding:12px;margin:8px;border:2px dashed #eee;border-radius:4px;text-align:center;font-size:11px;color:#bbb;transition:all .2s;}
.pool-dropzone.drag-over{border-color:#e74c3c;background:#fff0ee;color:#c0392b;}

/* Sections panel */
.sections-panel{display:flex;flex-direction:column;gap:8px;}
.section-item{background:#fff;border:1px solid #e0e0e0;border-radius:5px;overflow:hidden;}
.section-item.drag-over-section{border-color:#e8d98a;box-shadow:0 0 0 2px rgba(232,217,138,.4);}
.section-item.dragging-section{opacity:.4;}
.section-header{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#f9f9f9;border-bottom:1px solid #eee;}
.section-drag{color:#bbb;cursor:grab;font-size:15px;line-height:1;flex-shrink:0;}
.section-drag:active{cursor:grabbing;}
.section-name-input{flex:1;border:none;background:none;font-size:13px;font-weight:600;color:#333;padding:2px 4px;min-width:60px;}
.section-name-input:focus{outline:1px solid #e8d98a;border-radius:2px;}
.section-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px 4px;border-bottom:1px solid #f5f5f5;}
.section-meta input{padding:4px 7px;border:1px solid #eee;border-radius:3px;font-size:11px;}
.section-meta input:focus{outline:none;border-color:#e8d98a;}
.section-meta label{font-size:10px;color:#aaa;display:block;margin-bottom:2px;}
.section-drop-zone{min-height:38px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;transition:background .15s;}
.section-drop-zone.drag-over{background:#fffbec;outline:2px dashed #e8d98a;outline-offset:-4px;}
.section-drop-zone-hint{font-size:11px;color:#ccc;text-align:center;padding:6px;display:none;}
.section-drop-zone.empty .section-drop-zone-hint{display:block;}

/* Item chips in sections */
.item-chip{display:flex;align-items:center;gap:5px;padding:5px 7px;background:#f9f8f5;border:1px solid #e8e4d8;border-radius:4px;cursor:grab;}
.item-chip:active{cursor:grabbing;}
.item-chip.dragging{opacity:.3;}
.item-chip-drag{color:#ccc;font-size:13px;flex-shrink:0;}
.item-display-name{flex:1;font-size:12.5px;color:#333;min-width:40px;border:none;background:none;padding:0;outline:none;font-family:inherit;}
.item-display-name:focus{background:#fff;outline:1px solid #e8d98a;border-radius:2px;padding:1px 3px;}
.item-master-hint{font-size:10px;color:#bbb;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;}
.item-note-badge{font-size:10px;background:rgba(122,132,52,.12);border:1px solid rgba(122,132,52,.25);color:#666;border-radius:2px;padding:1px 5px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.item-note-badge:hover{background:rgba(122,132,52,.22);}
.remove-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:15px;line-height:1;padding:0 1px;flex-shrink:0;}
.remove-btn:hover{color:#c0392b;}
.add-section-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:2px dashed #ccc;border-radius:5px;background:none;cursor:pointer;color:#888;font-size:13px;width:100%;margin-top:4px;}
.add-section-btn:hover{border-color:#e8d98a;color:#666;}

/* Builder sidebar */
.builder-sidebar{display:flex;flex-direction:column;gap:10px;}


/* Terms editor */
.terms-list-edit{display:flex;flex-direction:column;gap:6px;}
.term-row{display:flex;gap:6px;align-items:flex-start;}
.term-row textarea{flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:3px;font-size:12px;resize:vertical;min-height:38px;font-family:inherit;}
.term-row textarea:focus{outline:none;border-color:#e8d98a;}
.add-term-btn{margin-top:6px;display:flex;align-items:center;gap:6px;padding:7px 12px;border:2px dashed #ccc;border-radius:4px;background:none;cursor:pointer;color:#888;font-size:12px;}
.add-term-btn:hover{border-color:#e8d98a;color:#666;}

/* Cancellation */
.cancel-rows{display:flex;flex-direction:column;gap:6px;}
.cancel-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center;}
.cancel-row input{padding:5px 8px;border:1px solid #ddd;border-radius:3px;font-size:12px;}
.cancel-row input:focus{outline:none;border-color:#e8d98a;}

/* Booking details */
.booking-rows{display:flex;flex-direction:column;gap:6px;}
.booking-row{display:grid;grid-template-columns:120px 1fr auto;gap:6px;align-items:center;}
.booking-row input{padding:5px 8px;border:1px solid #ddd;border-radius:3px;font-size:12px;}
.booking-row input:focus{outline:none;border-color:#e8d98a;}

/* Save indicator */
.save-indicator{font-size:12px;color:#27ae60;opacity:0;transition:opacity .5s;}
.save-indicator.show{opacity:1;}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:9999;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* Import hint */
.import-note{background:#fff8e1;border:1px solid #f0d060;border-radius:4px;padding:10px 14px;font-size:12px;color:#665500;margin-bottom:14px;}


/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#f0f0f0;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}

/* Pkg info in builder header */
.pkg-info-strip{background:#1a1a1a;color:#e8d98a;border-radius:5px;padding:10px 16px;display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.pkg-info-strip .pname{font-size:16px;font-weight:700;}
.pkg-info-strip .pprice{font-size:22px;font-weight:300;}
.pkg-info-strip input{background:rgba(255,255,255,.12);border:1px solid rgba(232,217,138,.4);color:#e8d98a;border-radius:3px;padding:4px 8px;font-size:inherit;font-family:inherit;}
.pkg-info-strip input:focus{outline:none;border-color:#e8d98a;}
.pkg-edit-fields{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.pkg-edit-fields label{font-size:11px;color:#a09060;}
.pi-field{display:flex;flex-direction:column;gap:2px;}

/* Price analysis in builder */
.price-analysis{display:flex;flex-direction:column;gap:6px;}
.pa-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;font-size:12px;}
.pa-item.ok{background:#f0faf0;border:1px solid #c3e6cb;}
.pa-item.warn{background:#fff8e1;border:1px solid #ffe082;}
.pa-item.high{background:#fff0ee;border:1px solid #ffcdd2;}
.pa-icon{font-size:14px;flex-shrink:0;}
.pa-name{flex:1;font-weight:500;}
.pa-price{color:#888;white-space:nowrap;}
.pa-ratio{font-size:11px;padding:1px 5px;border-radius:2px;white-space:nowrap;}
.pa-ratio.ok{background:#c3e6cb;color:#155724;}
.pa-ratio.warn{background:#ffe082;color:#856404;}
.pa-ratio.high{background:#ffcdd2;color:#721c24;}
.pa-swaps{margin-top:3px;margin-left:22px;font-size:11px;color:#888;}
.pa-swap-chip{display:inline-block;background:#f5f0d0;border:1px solid #e0c040;border-radius:2px;padding:1px 6px;margin:1px;cursor:pointer;color:#444;}
.pa-swap-chip:hover{background:#e8d98a;color:#1a1a1a;}

/* Responsive */
@media(max-width:900px){
  .editor-layout{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">UNQ</div>
  <span class="sep">|</span>
  <span style="font-size:13px;color:#ccc;">Package Editor</span>
  <nav>
    <button class="active" onclick="switchTab('matrix')">Item Matrix</button>
    <button onclick="switchTab('builder')">Package Builder</button>
    <button onclick="switchTab('terms')">Terms & Conditions</button>
    <button onclick="switchTab('venue')">Venue & Services</button>
    <button onclick="switchTab('design')">Design</button>
  </nav>
  <div class="topbar-right">
    <span class="save-indicator" id="saveInd">✓ Saved</span>
    <a href="help.html" target="_blank" class="btn btn-outline btn-sm" style="text-decoration:none;">? Help</a>
    <button class="btn btn-outline btn-sm" onclick="importData()">Import JSON</button>
    <button class="btn btn-gold btn-sm" onclick="exportAll()">Export Package Page</button>
  </div>
</div>

<div id="panel-matrix" class="panel active">
  <div class="matrix-controls">
    <input type="text" id="matrixSearch" placeholder="Filter items…" oninput="renderMatrix()">
    <select id="matrixFilter" onchange="renderMatrix()">
      <option value="all">All items</option>
      <option value="unassigned">Unassigned only</option>
      <option value="assigned">Assigned to ≥1 package</option>
    </select>
    <select id="matrixCategory" onchange="renderMatrix()">
      <option value="">All categories</option>
    </select>
  </div>
  <div class="matrix-wrap" id="matrixWrap"></div>
  <div class="legend">
    <div class="legend-item"><input type="checkbox" checked disabled> In package</div>
    <div class="legend-item"><input type="checkbox" disabled> Not in package</div>
    <div class="legend-item" style="background:#f0faf0;padding:3px 7px;border-radius:3px;"><input type="checkbox" disabled><span class="suggest-dot" style="position:static;display:inline-block;"></span> Good fit — suggest adding</div>
    <div class="legend-item"><span class="unassigned-tag">unassigned</span> Not in any package yet</div>
  </div>
  <div id="sectionModal" style="display:none;"></div>
</div>

<div id="panel-builder" class="panel">
  <div class="pkg-tabs" id="pkgTabs"></div>
  <div id="builderContent"></div>
</div>

<div id="panel-terms" class="panel">
  <div class="pkg-tabs" id="termsTabs"></div>
  <div id="termsContent"></div>
</div>

<div id="panel-venue" class="panel" style="display:none;">
  <div style="max-width:900px;">
    <div class="pkg-info-strip" style="margin-bottom:14px;">
      <div class="pkg-edit-fields">
        <div class="pi-field"><label>Page Subtitle</label>
          <input id="venueSubtitle" style="width:400px;font-size:13px;"
            onchange="setVenueField('subtitle',this.value)">
        </div>
      </div>
    </div>
    <div class="sections-panel" id="venueSectionsPanel"></div>
    <button class="add-section-btn" onclick="addVenueSection()" style="max-width:900px;margin-top:6px;">+ Add Section</button>
  </div>
</div>

<div id="panel-design" class="panel" style="display:none;">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 100px);">
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span style="font-size:13px;font-weight:700;color:#555;">Edit CSS</span>
        <select id="designPkgSel" onchange="updatePreview()" style="padding:5px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;"></select>
        <button class="btn btn-gold btn-sm" onclick="saveDesign()">Save Design</button>
        <button class="btn btn-outline btn-sm" onclick="resetDesign()">Reset to File</button>
        <span style="font-size:11px;color:#888;">Changes are saved locally. "Save Design" downloads updated template.html — replace the file to make permanent.</span>
      </div>
      <textarea id="cssEditor" spellcheck="false"
        style="flex:1;font-family:monospace;font-size:12px;padding:10px;border:1px solid #ddd;border-radius:4px;resize:none;line-height:1.5;tab-size:2;"
        oninput="schedulePreviewUpdate()"></textarea>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <span style="font-size:13px;font-weight:700;color:#555;">Live Preview</span>
      <iframe id="designPreview" style="flex:1;border:1px solid #ddd;border-radius:4px;background:#fff;"></iframe>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════════════════════
let DATA = null;
let TEMPLATE = null;       // full template.html string
let TEMPLATE_CSS = null;   // just the CSS between <style> tags (editable)
let activePkgTab = 0;
let activeTermsTab = 0;

-content:center;pointer-events:none;z-index:1;overflow:hidden;}\n    .wm-text{font-family:'BlippoMN',serif;font-size:160px;font-weight:900;color:var(--ink);opacity:0.025;letter-spacing:0.26em;user-select:none;white-space:nowrap;}\n    .content{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;min-height:0;}\n\n    /* Hero */\n    .pkg-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:7px 0;border-bottom:1px solid var(--gold-faint);margin-bottom:6px;flex-shrink:0;}\n    .unq-logo{font-family:'BlippoMN',serif;font-weight:900;letter-spacing:0.26em;font-size:13px;}\n    .pkg-number{font-size:11px;font-weight:600;letter-spacing:4px;text-indent:4px;color:var(--gold);text-transform:uppercase;margin-bottom:5px;}\n    .pkg-title-row{display:flex;align-items:baseline;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:2px;}\n    .pkg-name{font-family:'Cormorant Garamond','Georgia',serif;font-size:32px;font-weight:500;color:var(--ink);letter-spacing:0.5px;line-height:1;}\n    .pkg-at{font-size:20px;font-weight:300;color:var(--ink-mute);line-height:1;}\n    .pkg-price{font-size:52px;font-weight:300;color:var(--ink);letter-spacing:-1px;line-height:1;display:flex;align-items:baseline;gap:4px;}\n    .per-person{font-size:11px;font-weight:500;color:var(--ink-mute);letter-spacing:0.5px;margin-left:2px;align-self:flex-end;margin-bottom:6px;}\n    .pkg-desc{font-family:'Cormorant Garamond','Georgia',serif;font-size:12.5px;font-style:italic;color:var(--ink-mute);}\n\n    /* Ideal For \u2014 above table */\n    .ideal-row{display:flex;align-items:baseline;gap:10px;background:var(--gold-faint);border:1px solid var(--gold-dim);border-radius:2px;padding:5px 10px;margin-bottom:6px;flex-shrink:0;}\n    .ideal-label{font-size:7.5px;font-weight:700;letter-spacing:3px;text-indent:3px;color:var(--gold-bright);text-transform:uppercase;white-space:nowrap;flex-shrink:0;}\n    .ideal-text{font-family:'Cormorant Garamond','Georgia',serif;font-size:13px;font-style:italic;color:var(--ink-soft);}\n\n    /* Table wrapper with outer border */\n    .pkg-table{border:1px solid var(--gold-dim);border-radius:2px;overflow:hidden;margin-bottom:6px;flex-shrink:0;}\n\n    /* Header row */\n    .table-header{display:flex;background:var(--ink);padding:0;}\n    .th{font-size:7px;font-weight:700;letter-spacing:2px;text-indent:2px;color:#fff;text-transform:uppercase;padding:5px 8px;}\n\n    /* Section rows \u2014 fixed column widths */\n    .section{display:flex;align-items:stretch;border-bottom:1px solid var(--gold-dim);}\n    .section:last-child{border-bottom:none;}\n    .row-alt{background:rgba(122,132,52,0.06);}\n\n    .col-cat {width:82px; flex-shrink:0;padding:5px 8px;border-right:2px solid var(--gold-dim);background:rgba(122,132,52,0.05);}\n    .col-inst{width:104px;flex-shrink:0;padding:5px 8px;border-right:1px solid var(--gold-dim);}\n    .col-items{flex:1;min-width:0;padding:4px 8px;display:grid;grid-template-columns:1fr 1fr;align-content:start;}\n    .col-chip {width:74px; flex-shrink:0;padding:5px 6px;border-left:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;}\n\n    .sec-name{font-size:8px;font-weight:700;letter-spacing:2px;text-indent:2px;color:var(--gold-bright);text-transform:uppercase;line-height:1.4;padding-top:1px;}\n    .sec-inst{font-family:'Cormorant Garamond','Georgia',serif;font-size:13px;font-style:italic;color:var(--ink-mute);line-height:1.3;}\n    .item-name{font-family:'Cormorant Garamond','Georgia',serif;font-size:15px;font-weight:500;color:var(--ink);line-height:1.25;padding:2px 4px 2px 0;border-bottom:1px dotted rgba(122,132,52,0.20);}\n    .item-name:nth-child(2n){padding-left:6px;border-left:1px dotted rgba(122,132,52,0.20);}\n    .item-name:nth-last-child(-n+2){border-bottom:none;}\n    .item-name:last-child:nth-child(odd){grid-column:1/-1;border-left:none;padding-left:0;}\n    .item-exc-tag{font-size:7px;font-weight:600;color:var(--ink-mute);backgr async function loadData() {
  // Template — use embedded, then apply localStorage CSS override if present
  TEMPLATE = _EMBEDDED_TEMPLATE;
  const cssMatch = TEMPLATE.match(/<style>([\s\S]*?)<\/style>/);
  TEMPLATE_CSS = cssMatch ? cssMatch[1] : '';
  const savedCss = localStorage.getItem('unq_template_css');
  if (savedCss) TEMPLATE_CSS = savedCss;

  // Try fetching fresh data.json (works when served over HTTP)
  try {
    const r = await fetch('data.json');
    const fresh = await r.json();
    // If no localStorage save yet, use fresh file
    if (!localStorage.getItem('unq_editor_data')) {
      DATA = fresh;
    }
  } catch(e) {
    // file:// or network error — fall through to localStorage / embedded
  }
  if (!DATA) {
    const saved = localStorage.getItem('unq_editor_data');
    DATA = saved ? JSON.parse(saved) : JSON.parse(_EMBEDDED_DATA);
  }
  init();

// Build Map: masterMenuItemName → Set of pkg ids
// Uses masterMenuRefs if present, otherwise exact name match
function buildMasterToPkgMap() {
  const map = new Map(); // masterMenu item name → Set<pkgId>
  DATA.packages.forEach(pkg => {
    pkg.sections.forEach(sec => {
      sec.items.forEach(item => {
        const refs = (item.masterMenuRefs && item.masterMenuRefs.length)
          ? item.masterMenuRefs
          : [item.name]; // fallback: exact name
        refs.forEach(ref => {
          if (!map.has(ref)) map.set(ref, new Set());
          map.get(ref).add(pkg.id);
        });
      });
    });
  });
  return map;
}

// Suggestion threshold: item fits a package if price ≤ 30% of package price
function isSuggestedFit(itemPrice, pkgPrice) {
  if (!itemPrice || !pkgPrice) return false;
  return itemPrice <= pkgPrice * 0.30;
}

function renderMatrix() {
  const search = document.getElementById('matrixSearch').value.toLowerCase();
  const filter = document.getElementById('matrixFilter').value;
  const category = document.getElementById('matrixCategory').value;

  const masterToPkg = buildMasterToPkgMap();
  const pkgs = DATA.packages;

  let allItems = DATA.masterMenu.map(m => ({
    name: m.name, price: m.price,
    category: m.category || 'Other', menuSection: m.menuSection
  }));

  allItems = allItems.filter(item => {
    if (search && !item.name.toLowerCase().includes(search)) return false;
    if (category && item.category !== category) return false;
    const isAssigned = masterToPkg.has(item.name);
    if (filter === 'unassigned' && isAssigned) return false;
    if (filter === 'assigned' && !isAssigned) return false;
    return true;
  });

  const grouped = new Map();
  allItems.forEach(item => {
    const cat = item.category;
    if (!grouped.has(cat)) grouped.set(cat, []);
    grouped.get(cat).push(item);
  });

  let html = `<table class="matrix">
    <thead><tr>
      <th class="item-col">Item</th>
      <th class="price-col">₹ Price</th>
      ${pkgs.map(p => `<th><span>${p.name}</span><span class="pkg-price-header">₹${p.price}</span></th>`).join('')}
    </tr></thead><tbody>`;

  grouped.forEach((items, cat) => {
    html += `<tr class="section-divider"><td colspan="${pkgs.length + 2}">${cat}</td></tr>`;
    items.forEach(item => {
      const isAssigned = masterToPkg.has(item.name);
      const safeN = item.name.replace(/'/g, "\\'");

      const itemCell = `<td class="item-col${isAssigned ? '' : ' unassigned'}">
        ${item.name}${!isAssigned ? ' <span class="unassigned-tag">unassigned</span>' : ''}
      </td>`;
      const priceCell = `<td class="price-cell">${item.price ? '₹' + item.price : '—'}</td>`;

      const pkgCells = pkgs.map(pkg => {
        const inPkg = isAssigned && masterToPkg.get(item.name).has(pkg.id);
        const fits = !inPkg && isSuggestedFit(item.price, pkg.price);
        const cellClass = `check-cell${fits ? ' suggest' : ''}`;
        const dotHtml = fits ? `<span class="suggest-dot" title="Good price fit for this package (₹${item.price} vs ₹${pkg.price}/person)"></span>` : '';
        const safeId = pkg.id;
        return `<td class="${cellClass}">
          <input type="checkbox" ${inPkg ? 'checked' : ''}
            onchange="toggleItemInPackage('${safeN}','${safeId}',this.checked,this)"
            title="${item.name} in ${pkg.name}">${dotHtml}
        </td>`;
      }).join('');

      html += `<tr>${itemCell}${priceCell}${pkgCells}</tr>`;
    });
  });

  html += `</tbody></table>`;
  document.getElementById('matrixWrap').innerHTML = html;
}

// ── Toggle item in package via matrix checkbox ──
function toggleItemInPackage(masterItemName, pkgId, checked, cbEl) {
  const pkg = DATA.packages.find(p => p.id === pkgId);
  if (!pkg) return;
  if (checked) {
    // Add to first section (or create one)
    if (!pkg.sections.length) pkg.sections.push({name:'Items',instruction:'',chip:'',items:[]});
    pkg.sections[0].items.push({ name: masterItemName, note: null, masterMenuRefs: [masterItemName] });
  } else {
    pkg.sections.forEach(sec => {
      sec.items = sec.items.filter(item => {
        const refs = item.masterMenuRefs && item.masterMenuRefs.length ? item.masterMenuRefs : [item.name];
        return !refs.includes(masterItemName);
      });
    });
  }
  saveToLocalStorage();
  renderMatrix();
  const pi = DATA.packages.indexOf(pkg);
  if (activePkgTab === pi) { refreshSectionsPanel(pi); refreshPool(pi); }
}

function renderPool(pi) {
  const pkg = DATA.packages[pi];

    (item.masterMenuRefs && item.masterMenuRefs.length ? item.masterMenuRefs : [item.name])

    return true;

  items.forEach(m => {

  });

  let listHtml = '';
  grouped.forEach((list, cat) => {
    listHtml += `<div class="pool-cat-header">${cat}</div>`;

// ═══════════════════════════════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════════════════════════════

// From pool → section
function onPoolDragStart(event, masterName) {
  dragState = { source: 'pool', masterName };
  event.dataTransfer.effectAllowed = 'copy';
  event.dataTransfer.setData('text/plain', masterName);
}

// From section item chip → section/pool
function onChipDragStart(event, pi, si, ii) {
  dragState = { source: 'chip', pi, si, ii };
  event.dataTransfer.effectAllowed = 'move';
  event.currentTarget.classList.add('dragging');
}

// From section header → reorder
function onSectionDragStart(event, pi, si) {
  dragState = { source: 'sectionHeader', pi, si };
  event.dataTransfer.effectAllowed = 'move';
  event.currentTarget.closest('.section-item').classList.add('dragging-section');
}

function onDragEnd(event) {
  dragState = null;
  document.querySelectorAll('.dragging,.dragging-section').forEach(el => {
    el.classList.remove('dragging','dragging-section');
  });
}

// Drop zone hover on section drop area
function onDropzoneOver(event, pi, si) {
  if (!dragState) return;
  if (dragState.source === 'sectionHeader') return;
  event.preventDefault();
  document.getElementById(`dropzone-${pi}-${si}`).classList.add('drag-over');
}
function onDropzoneLeave(event, pi, si) {
  document.getElementById(`dropzone-${pi}-${si}`).classList.remove('drag-over');
}

// Section header drag-over (for section reorder)
function onSectionHeaderDragOver(event, pi, si) {
  if (!dragState || dragState.source !== 'sectionHeader') return;
  event.preventDefault();
  document.getElementById(`sec-${pi}-${si}`).classList.add('drag-over-section');
}
function onSectionHeaderDragLeave(event, pi, si) {
  document.getElementById(`sec-${pi}-${si}`).classList.remove('drag-over-section');
}
function onDropToSectionHeader(event, pi, si) {
  document.querySelectorAll('.drag-over-section').forEach(el => el.classList.remove('drag-over-section'));
  if (!dragState || dragState.source !== 'sectionHeader') return;
  event.preventDefault();
  const fromSi = dragState.si;
  if (fromSi === si) return;
  const pkg = DATA.packages[pi];
  const [moved] = pkg.sections.splice(fromSi, 1);
  pkg.sections.splice(si, 0, moved);
  dragState = null;
  saveToLocalStorage();
  refreshSectionsPanel(pi);
}

// Drop onto a section drop zone
function onDropToSection(event, pi, si) {
  event.preventDefault();
  document.getElementById(`dropzone-${pi}-${si}`).classList.remove('drag-over');
  if (!dragState) return;
  const pkg = DATA.packages[pi];

  if (dragState.source === 'pool') {
    // Add new item from pool
    const masterName = dragState.masterName;
    pkg.sections[si].items.push({ name: masterName, note: null, masterMenuRefs: [masterName] });
    saveToLocalStorage();
    refreshSectionsPanel(pi);
    refreshPool(pi);
    renderMatrix();
  } else if (dragState.source === 'chip') {
    const { pi: srcPi, si: srcSi, ii: srcIi } = dragState;
    if (srcPi !== pi) return; // cross-package not supported
    if (srcSi === si) return; // same section, no-op (reorder within section not needed)
    const [moved] = pkg.sections[srcSi].items.splice(srcIi, 1);
    pkg.sections[si].items.push(moved);
    saveToLocalStorage();
    refreshSectionsPanel(pi);
  }
  dragState = null;
}

// Pool drop zone — drop chip here to remove
function onPoolDropzoneOver(event) {
  if (!dragState || dragState.source !== 'chip') return;
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}
function onPoolDropzoneLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}
function onDropToPool(event, pi) {
  event.currentTarget.classList.remove('drag-over');
  if (!dragState || dragState.source !== 'chip') return;
  event.preventDefault();
  const { si, ii } = dragState;
  const pkg = DATA.packages[pi];
  pkg.sections[si].items.splice(ii, 1);
  dragState = null;
  saveToLocalStorage();
  refreshSectionsPanel(pi);
  refreshPool(pi);
  renderMatrix();
}

function renderPriceAnalysis(pkg) {
  const masterPriceMap = new Map(DATA.masterMenu.map(m => [m.name, m.price]));

  // Collect unique master refs with their prices for this package
  const seen = new Map(); // masterRef → {price, displayName, section}
  pkg.sections.forEach(sec => {
    sec.items.forEach(item => {
      const refs = (item.masterMenuRefs && item.masterMenuRefs.length) ? item.masterMenuRefs : [item.name];
      refs.forEach(ref => {
        if (!seen.has(ref)) {
          seen.set(ref, { price: masterPriceMap.get(ref) || null, displayName: item.name, section: sec.name });
        }
      });
    });
  });

  if (!seen.size) return `<div style="font-size:12px;color:#aaa;">No items yet.</div>`;

  // Sort: high ratio first
  const entries = [...seen.entries()].map(([ref, v]) => ({
    ref, price: v.price, displayName: v.displayName, section: v.section,
    ratio: v.price ? v.price / pkg.price : 0
  })).sort((a, b) => b.ratio - a.ratio);

  const lines = entries.map(e => {
    const pct = e.price ? Math.round(e.price / pkg.price * 100) : null;
    let level, label;
    if (!e.price)        { level = 'ok';   label = '—'; }
    else if (pct <= 20)  { level = 'ok';   label = pct + '%'; }
    else if (pct <= 35)  { level = 'warn'; label = pct + '%'; }
    else                 { level = 'high'; label = pct + '%'; }
    const icon = level === 'ok' ? '✓' : level === 'warn' ? '~' : '⚠';

    // For high items: suggest alternatives in same category
    let swapHtml = '';
    if (level === 'high') {
      const master = DATA.masterMenu.find(m => m.name === e.ref);
      const cat = master ? master.category : '';
      const alts = DATA.masterMenu
        .filter(m => m.category === cat && m.price && m.price <= pkg.price * 0.30 && m.name !== e.ref)
        .sort((a, b) => b.price - a.price).slice(0, 4);
      if (alts.length) {
        const chips = alts.map(a =>
          `<span class="pa-swap-chip" title="Swap to ${a.name} (₹${a.price})"
            onclick="swapItem('${pkg.id}','${e.ref.replace(/'/g,"\\'")}','${a.name.replace(/'/g,"\\'")}')"
            >↔ ${a.name} ₹${a.price}</span>`
        ).join('');
        swapHtml = `<div class="pa-swaps">Swap: ${chips}</div>`;
      }
    }

    return `<div>
      <div class="pa-item ${level}">
        <span class="pa-icon">${icon}</span>
        <span class="pa-name" title="${e.ref}">${e.displayName}</span>
        <span class="pa-price">${e.price ? '₹'+e.price : '—'}</span>
        <span class="pa-ratio ${level}">${label}</span>
      </div>${swapHtml}
    </div>`;
  }).join('');

  const highCount = entries.filter(e => e.ratio > 0.35).length;
  const summary = highCount
    ? `<div style="font-size:11px;color:#c0392b;margin-bottom:8px;">⚠ ${highCount} item(s) may be pricey for this package tier. Consider swapping.</div>`
    : `<div style="font-size:11px;color:#27ae60;margin-bottom:8px;">✓ All items within reasonable price range.</div>`;

  return summary + `<div class="price-analysis">${lines}</div>`;
}

function swapItem(pkgId, oldRef, newRef) {
  const pkg = DATA.packages.find(p => p.id === pkgId);
  const newMaster = DATA.masterMenu.find(m => m.name === newRef);
  pkg.sections.forEach(sec => {
    sec.items.forEach(item => {
      const refs = item.masterMenuRefs || [];
      const idx = refs.indexOf(oldRef);
      if (idx >= 0) {
        refs[idx] = newRef;
        item.name = newRef; // update display name to the new item
        item.masterMenuRefs = refs;
      }
    });
  });
  saveToLocalStorage();
  renderBuilder(DATA.packages.indexOf(pkg));
  renderMatrix();
  showToast(`Swapped to ${newRef}`);
}

function renderPkgStats(pkg) {
  const totalItems = pkg.sections.reduce((s, sec) => s + sec.items.length, 0);
  const uniqueItems = new Set(pkg.sections.flatMap(s => s.items.map(i => i.name))).size;
  return `<div style="font-size:12px;color:#666;display:flex;flex-direction:column;gap:6px;">
    <div>Sections: <strong>${pkg.sections.length}</strong></div>
    <div>Total item slots: <strong>${totalItems}</strong></div>
    <div>Unique items: <strong>${uniqueItems}</strong></div>
    <div>Package price: <strong>₹${pkg.price}/person</strong></div>
  </div>`;
}

function renderBookingRows(i) {
  const pkg = DATA.packages[i];
  const entries = Object.entries(pkg.booking || {});
  return entries.map((entry, ri) => `
    <div class="booking-row">
      <input value="${esc(entry[0])}" placeholder="Label" onchange="setBookingKey(${i},${ri},this.value,'key')">
      <input value="${esc(entry[1])}" placeholder="Value" onchange="setBookingKey(${i},${ri},this.value,'val')">
      <button class="remove-btn" onclick="removeBookingRow(${i},${ri})">×</button>
    </div>`).join('');
}


// ── Section / Item mutations ──
function setPkgField(pi, field, value) {
  DATA.packages[pi][field] = value;
  saveToLocalStorage();
  if (field === 'name' || field === 'price') {
    renderPkgTabs();
    renderTermsTabs();
  }
}

function setSectionField(pi, si, field, value) {
  DATA.packages[pi].sections[si][field] = value;
  saveToLocalStorage();
}

function setItemName(pi, si, ii, value) {
  DATA.packages[pi].sections[si].items[ii].name = value;
  saveToLocalStorage();
}

function removeItem(pi, si, ii) {
  DATA.packages[pi].sections[si].items.splice(ii, 1);
  saveToLocalStorage();
  refreshSectionsPanel(pi);
  refreshPool(pi);
  renderMatrix();
}

function removeSection(pi, si) {
  if (!confirm(`Delete section "${DATA.packages[pi].sections[si].name}"?`)) return;
  DATA.packages[pi].sections.splice(si, 1);
  saveToLocalStorage();
  refreshSectionsPanel(pi);
}

function addSection(pi) {
  DATA.packages[pi].sections.push({ name: 'New Section', instruction: '', chip: '', items: [] });
  saveToLocalStorage();
  refreshSectionsPanel(pi);
}

function deletePackage(pi) {
  if (!confirm(`Delete package "${DATA.packages[pi].name}"? This cannot be undone.`)) return;
  DATA.packages.splice(pi, 1);
  activePkgTab = Math.min(activePkgTab, DATA.packages.length - 1);
  saveToLocalStorage();
  renderPkgTabs(); renderTermsTabs();
  renderBuilder(activePkgTab); renderTermsEditor(activeTermsTab);
  renderMatrix();
}

function addPackage() {
  DATA.packages.push({
    id: `pkg${Date.now()}`,
    number: DATA.packages.length + 1,
    name: 'New Package',
    price: 0,
    description: '',
    idealLabel: 'Ideal For',
    idealValue: '',
    waterNote: '',
    sections: [],
    booking: { 'Format': '', 'Min – Max': '', 'Advance': '50% to confirm' },
    terms: [],
    cancellation: [
      { when: 'More than 24 hrs', result: 'Full Refund' },
      { when: 'Within 24 hrs', result: '50% Refund' },

// ── Booking rows ──
function setBookingKey(pi, ri, value, which) {
  const entries = Object.entries(DATA.packages[pi].booking);
  if (which === 'key') {
    const oldKey = entries[ri][0];
    const val = DATA.packages[pi].booking[oldKey];
    delete DATA.packages[pi].booking[oldKey];
    DATA.packages[pi].booking[value] = val;
  } else {
    DATA.packages[pi].booking[entries[ri][0]] = value;
  }
  saveToLocalStorage();
}

function removeBookingRow(pi, ri) {
  const key = Object.keys(DATA.packages[pi].booking)[ri];
  delete DATA.packages[pi].booking[key];
  saveToLocalStorage();
  document.getElementById(`bookingRows-${pi}`).innerHTML = renderBookingRows(pi);
}

function addBookingRow(pi) {
  DATA.packages[pi].booking['New Field'] = '';
  saveToLocalStorage();
  document.getElementById(`bookingRows-${pi}`).innerHTML = renderBookingRows(pi);
}

function setTerm(pi, ti, value) {

}

function removeTerm(pi, ti) {

function addTerm(pi) {

function setCancel(pi, ci, field, value) {
  DATA.packages[pi].cancellation[ci][field] = value;

}

function removeCancel(pi, ci) {
  DATA.packages[pi].cancellation.splice(ci, 1);

}

function addCancel(pi) {

// ═══════════════════════════════════════════════════════════
// IMPORT / EXPORT
// ═══════════════════════════════════════════════════════════
function importData() {
  document.getElementById('importFile').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      DATA = JSON.parse(ev.target.result);
      saveToLocalStorage();
      activePkgTab = 0; activeTermsTab = 0;
      // Rebuild category filter
      document.getElementById('matrixCategory').innerHTML = '<option value="">All categories</option>';
      const cats = [...new Set(DATA.masterMenu.map(m => m.category).filter(Boolean))].sort();
      const sel = document.getElementById('matrixCategory');
      cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
      renderPkgTabs(); renderTermsTabs(); renderMatrix(); renderBuilder(0); renderTermsEditor(0);
      showToast('Data imported successfully.');
    } catch(err) {
      showToast('Invalid JSON file.', 3000);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function exportAll() {
  if (!TEMPLATE) {
    showToast('template.html not loaded — cannot export safely.', 4000);
    return;
  }
  // Export updated data.json
  const dataBlob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const dataUrl = URL.createObjectURL(dataBlob);
  const a1 = document.createElement('a'); a1.href = dataUrl; a1.download = 'data.json'; a1.click();
  URL.revokeObjectURL(dataUrl);

  // Export regenerated package/index.html using template
  const html = generatePackageHTML();
  const htmlBlob = new Blob([html], { type: 'text/html' });
  const htmlUrl = URL.createObjectURL(htmlBlob);
  setTimeout(() => {
    const a2 = document.createElement('a'); a2.href = htmlUrl; a2.download = 'package-index.html'; a2.click();
    URL.revokeObjectURL(htmlUrl);
  }, 300);

  showToast('Exported data.json + package-index.html');
}

// ═══════════════════════════════════════════════════════════
// DESIGN TAB
// ═══════════════════════════════════════════════════════════
let previewTimer = null;

function initDesignTab() {
  const ed = document.getElementById('cssEditor');
  if (ed && TEMPLATE_CSS !== null) {
    ed.value = TEMPLATE_CSS;
    updatePreview();
  }
}

function schedulePreviewUpdate() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 600);
}

function updatePreview() {
  const ed = document.getElementById('cssEditor');
  if (!ed || !TEMPLATE) return;
  TEMPLATE_CSS = ed.value;
  const pkgIdx = parseInt(document.getElementById('designPkgSel').value) || 0;
  const pkg = DATA.packages[pkgIdx];
  if (!pkg) return;
  const totalPages = DATA.packages.length + 1;
  const pageHtml = generatePackagePage(pkg, pkgIdx + 1, totalPages);
  // Build a single-page preview using current CSS
  const previewHtml = TEMPLATE
    .replace(/<style>[\s\S]*?<\/style>/, `<style>\n${TEMPLATE_CSS}\n</style>`)
    .replace('{{PAGES}}', pageHtml);
  const iframe = document.getElementById('designPreview');
  iframe.srcdoc = previewHtml;
}

function saveDesign() {
  const ed = document.getElementById('cssEditor');
  if (!ed || !TEMPLATE) return;
  TEMPLATE_CSS = ed.value;
  localStorage.setItem('unq_template_css', TEMPLATE_CSS);
  // Download updated template.html
  const updatedTemplate = TEMPLATE
    .replace(/<style>[\s\S]*?<\/style>/, `<style>\n${TEMPLATE_CSS}\n</style>`);
  const blob = new Blob([updatedTemplate], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'template.html'; a.click();
  URL.revokeObjectURL(url);
  showToast('Design saved locally + template.html downloaded. Replace menu-editor/template.html to make it permanent.');
}

function resetDesign() {
  if (!confirm('Reset CSS to the last loaded template.html? Local unsaved changes will be lost.')) return;
  localStorage.removeItem('unq_template_css');
  // Try fetch first (HTTP), fall back to embedded
  const resetFn = t => {
    TEMPLATE = t;
    const m = t.match(/<style>([\s\S]*?)<\/style>/);
    TEMPLATE_CSS = m ? m[1] : '';
    document.getElementById('cssEditor').value = TEMPLATE_CSS;
    updatePreview();
    showToast('Reset to template.html');
  };
  fetch('template.html').then(r => r.text()).then(resetFn).catch(() => resetFn(_EMBEDDED_TEMPLATE));
}

// HTML GENERATOR — template-based

function generatePackageHTML() {
  const totalPages = DATA.packages.length + 1; // +1 for venue page
  const pagesHTML = DATA.packages.map((pkg, i) => generatePackagePage(pkg, i + 1, totalPages)).join('\n');

  const activeCss = TEMPLATE_CSS || '';
  let out = TEMPLATE
    .replace(/<style>[\s\S]*?<\/style>/, `<style>\n${activeCss}\n</style>`)
    .replace('{{PAGES}}', '<!-- GENERATED BY UNQ PACKAGE EDITOR -->\n' + pagesHTML)
    .replace('{{VENUE_PAGE}}', venueHTML);
  return out;
}

// UTILITY
// ═══════════════════════════════════════════════════════════
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
