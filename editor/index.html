<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UNQ Kitchen — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--olive:#7A8434;--olive-dark:#5C6330;--ink:#14160C;--gold:#c9a96a;--paper:#fff;--paper-2:#faf9f3;--line:rgba(122,132,52,.22);--muted:rgba(20,22,12,.55);--danger:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--paper-2);color:var(--ink);}
header{display:flex;align-items:center;gap:16px;background:var(--ink);color:#f5f0e6;padding:10px 18px;position:sticky;top:0;z-index:10;}
header .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:2px;color:var(--gold);}
header .tabs{display:flex;gap:4px;margin-left:8px;}
header .tabs button{background:transparent;border:1px solid rgba(245,240,230,.2);color:#cdc8bd;border-radius:7px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;}
header .tabs button.active{background:var(--olive);border-color:var(--olive);color:#fff;}
header .tabs button:disabled{opacity:.5;cursor:not-allowed;}
header .spacer{flex:1;}
header #status{font-size:12.5px;color:#bdb7aa;}
header #status.err{color:#f3a59a;}
header #status.ok{color:#9ed8a0;}
#save{background:var(--gold);color:#1a1a1a;border:none;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;}
#save:disabled{opacity:.45;cursor:not-allowed;}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 52px);}
.side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px 0;}
.side .grp{font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:14px 16px 4px;}
.side a{display:flex;justify-content:space-between;padding:7px 16px;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;border-left:3px solid transparent;}
.side a:hover{background:var(--paper-2);}
.side a.active{border-left-color:var(--olive);background:rgba(122,132,52,.08);color:var(--olive-dark);font-weight:600;}
.side a .n{color:var(--muted);font-size:11px;}
.main{padding:20px 24px;overflow-y:auto;}
.main h2{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--olive-dark);}
.main .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.card .row1{display:flex;gap:10px;align-items:center;}
.card input,.card textarea,.card select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);}
.card input:focus,.card textarea:focus,.card select:focus{outline:none;border-color:var(--olive);}
.card .iname{font-size:15px;font-weight:600;flex:1;}
.card textarea{width:100%;margin-top:8px;font-size:13px;resize:vertical;min-height:42px;}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.card .meta label{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center;}
.card .img{flex:1;min-width:200px;font-size:12px;}
.vtable{width:100%;border-collapse:collapse;margin-top:10px;}
.vtable th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;font-weight:600;}
.vtable td{padding:3px 6px;}
.vtable input.vn{width:140px;}
.vtable input.vi{width:100%;}
.vtable input.vp{width:74px;}
.vtable .ving{width:46%;}
.btn{border:1px solid var(--line);background:var(--paper-2);color:var(--olive-dark);border-radius:6px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;}
.btn:hover{background:#fff;}
.btn.add{margin-top:10px;}
.x{border:none;background:transparent;color:var(--danger);font-size:16px;cursor:pointer;line-height:1;padding:2px 6px;}
.tag-cb{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);}
.single-price{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;}
.placeholder{max-width:640px;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:28px;color:var(--muted);font-size:14px;line-height:1.6;}
.placeholder h3{font-family:'Cormorant Garamond',serif;color:var(--olive-dark);font-size:20px;margin-bottom:8px;}
.previews{margin-left:auto;display:flex;gap:8px;}
.previews a{font-size:12px;color:#cdc8bd;text-decoration:none;border:1px solid rgba(245,240,230,.2);border-radius:6px;padding:5px 9px;}
.previews a:hover{color:var(--gold);}
.hidden{display:none;}
/* coverage map */
.cov-wrap{overflow:auto;height:calc(100vh - 240px);min-height:300px;}
.cov-table{border-collapse:collapse;font-size:12px;min-width:600px;}
.cov-table th{background:var(--ink);color:#f5f0e6;padding:6px 10px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2;}
.cov-table th.pkg{text-align:center;max-width:90px;min-width:70px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.cov-table th.pkg:hover{color:var(--gold);}
.cov-table td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.cov-table td.chk{text-align:center;cursor:pointer;max-width:90px;overflow:hidden;text-overflow:ellipsis;}
.cov-table td.chk:hover{background:rgba(122,132,52,.1);}
.cov-table .grp-row td{background:var(--paper-2);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:6px 10px;cursor:pointer;user-select:none;}
.cov-table .grp-row:hover td{background:rgba(122,132,52,.08);}
.cov-table td.grp-pkg-cell{text-align:center;padding:4px;vertical-align:middle;background:var(--paper-2);}
.cov-grp-badge{display:inline-block;background:var(--olive);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center;letter-spacing:0;}
.cov-grp-badge.it-badge{background:transparent;color:var(--olive-dark);border:1px solid var(--olive);font-weight:600;}
.cov-table .it-hdr td{background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink);padding:6px 10px;cursor:pointer;user-select:none;}
.cov-table .it-hdr:hover td{background:rgba(122,132,52,.05);}
.it-toggle{display:inline-block;width:14px;font-size:9px;color:var(--muted);margin-right:2px;}
.cov-table .var-row td.var-name{padding-left:22px;color:var(--muted);}
.cov-sec{color:var(--olive-dark);font-size:10.5px;font-weight:600;}
.cov-item-price{color:var(--muted);font-size:10.5px;margin-left:6px;font-variant-numeric:tabular-nums;}
.cov-pkg-price{display:block;font-size:10px;font-weight:400;opacity:.75;margin-top:2px;}
.cov-hd{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.cov-hd h2{margin-bottom:0;}
.cov-toolbar{display:flex;gap:6px;margin-left:auto;}
.cov-item-chips{margin-top:4px;}
.cov-sec-chips{margin-top:4px;padding-top:6px;border-top:1px solid var(--line);}
.tmpl-chips .tc-sm{font-size:10.5px;padding:2px 9px;}
.cov-table td.chk.cov-dimmed .cov-sec{opacity:.28;}
.cov-table td.chk.cov-dimmed{background:transparent;}
.cov-popover{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.15);min-width:160px;max-width:240px;font-size:12px;padding:4px;}
.cov-popover .cov-pop-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px 4px;}
.cov-popover button{display:block;width:100%;text-align:left;background:none;border:none;font:inherit;font-size:12.5px;padding:6px 8px;border-radius:5px;cursor:pointer;color:var(--ink);}
.cov-popover button:hover{background:rgba(122,132,52,.1);}
.cov-popover button.cov-pop-active{background:rgba(122,132,52,.18);font-weight:600;color:var(--olive-dark);}
.cov-popover .cov-pop-empty{padding:6px 8px;color:var(--muted);font-style:italic;}
/* compare sections */
.cmp-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.cmp-bar label{font-size:13px;color:var(--muted);}
.cmp-bar select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--paper);}
.cmp-pkg-head{font-size:13px;font-weight:700;color:var(--olive-dark);margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--olive);}
/* side-by-side */
.sbs-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.sbs-wrap .cpyfrom{font-size:12px;}
.sbs-pickers{display:flex;gap:12px;margin-bottom:16px;}
.sbs-pickers>div{flex:1;}
.sbs-pickers label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.sbs-pickers select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--paper);width:100%;}
/* price analyser */
.pa-header{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
.pa-stat{text-align:center;}
.pa-stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.pa-stat .val{font-size:24px;font-weight:700;margin-top:2px;}
.pa-sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.pa-sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.pa-sec-head .sname{font-weight:700;font-size:15px;flex:1;}
.pa-sec-head .smode{font-size:11px;color:var(--muted);background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:2px 8px;}
.pa-sec-head .scost{font-size:15px;font-weight:700;color:var(--olive-dark);}
.pa-overrides{display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.pa-overrides input{width:52px;font:inherit;border:1px solid var(--line);border-radius:5px;padding:3px 6px;}
.pa-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.pa-tbl th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);}
.pa-tbl td{padding:5px 8px;border-bottom:1px solid rgba(122,132,52,.1);}
.pa-tbl td.price{text-align:right;font-variant-numeric:tabular-nums;}
.fit-ok{color:#2d8a2d;font-weight:600;}
.fit-warn{color:#c07700;font-weight:600;}
.fit-over{color:var(--danger);font-weight:600;}
.fit-none{color:var(--muted);}
/* copy-from bar */
.cpyfrom{background:rgba(122,132,52,.07);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;}
.cpyfrom label{color:var(--muted);}
.cpyfrom select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper);}
.cpyfrom button{background:var(--olive);color:#fff;border:none;border-radius:6px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.cpyfrom button:disabled{opacity:.4;cursor:not-allowed;}
/* section filter bar */
.sec-filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.sec-filter-bar input{flex:1;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:var(--paper);}
.sec-filter-bar input:focus{outline:none;border-color:var(--olive);}
.sec-filter-bar .sfc-count{font-size:12px;color:var(--muted);white-space:nowrap;}
/* section accordion */
.sec-accord{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:7px;background:#fff;transition:box-shadow .12s;}
.sec-accord.open{box-shadow:0 2px 10px rgba(0,0,0,.09);}
.sec-row{display:flex;align-items:center;gap:7px;padding:9px 11px;background:#fff;}
.sec-accord.open .sec-row{background:var(--paper-2);border-bottom:1px solid var(--line);}
.sec-name-inp{font:inherit;font-size:14px;font-weight:600;border:none;background:transparent;flex:1;min-width:0;padding:2px 4px;border-radius:5px;color:var(--ink);}
.sec-name-inp:hover{background:rgba(122,132,52,.06);}
.sec-name-inp:focus{outline:none;background:rgba(122,132,52,.08);}
.sec-pills{display:flex;align-items:center;gap:4px;flex-shrink:1;min-width:0;overflow:hidden;}
.sec-accord.open .sec-pills{opacity:.5;}
.spill{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:2px 8px;background:var(--paper-2);color:var(--muted);white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;}
.spill.type{color:var(--olive-dark);background:rgba(122,132,52,.1);border-color:rgba(122,132,52,.3);}
.spill.cnt{background:transparent;border-color:transparent;color:var(--muted);}
.sec-chevron{font-size:14px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 5px;line-height:1;flex-shrink:0;transition:transform .15s;}
.sec-accord.open .sec-chevron{transform:rotate(90deg);color:var(--olive-dark);}
.sec-body{padding:12px 13px;display:none;}
.sec-accord.open .sec-body{display:block;}
/* template chips row */
.tmpl-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.tmpl-chips .tc-label{font-size:11px;color:var(--muted);letter-spacing:.3px;}
.tmpl-chips .tc{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--paper-2);color:var(--olive-dark);border-radius:12px;padding:3px 11px;cursor:pointer;white-space:nowrap;}
.tmpl-chips .tc:hover{background:rgba(122,132,52,.15);border-color:var(--olive);}
.tmpl-chips .tc.active{background:var(--olive);border-color:var(--olive);color:#fff;}
/* section fields row */
.sec-fields{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px;}
.sec-fields input,.sec-fields select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--paper);}
.sec-fields input:focus,.sec-fields select:focus{outline:none;border-color:var(--olive);}
.sec-fields .sf-inst{flex:1;min-width:150px;}
.sec-fields .sf-chip{width:120px;}
/* item rows in section */
.item-row{display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid rgba(122,132,52,.07);}
.item-row:last-of-type{border-bottom:none;}
.item-row .mv{border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 3px;line-height:1;}
.item-row .mv:hover{color:var(--ink);}
.item-row input.idn{flex:1;font:inherit;font-size:13px;border:1px solid transparent;border-radius:6px;padding:4px 7px;background:transparent;}
.item-row input.idn:hover{border-color:var(--line);background:var(--paper);}
.item-row input.idn:focus{outline:none;border-color:var(--olive);background:var(--paper);}
.item-row input.inote{width:120px;font:inherit;font-size:12px;border:1px solid transparent;border-radius:6px;padding:4px 7px;color:var(--muted);background:transparent;}
.item-row input.inote:hover{border-color:var(--line);background:var(--paper);}
.item-row input.inote:focus{outline:none;border-color:var(--olive);background:var(--paper);color:var(--ink);}
/* move buttons in section header */
.mv-sec{border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:3px 4px;line-height:1;flex-shrink:0;}
.mv-sec:hover{color:var(--ink);}
/* template library */
.tmpl-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.tmpl-card .row1{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.tmpl-card .tlabel{font-size:14px;font-weight:600;flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit;}
.tmpl-card .tlabel:focus{outline:none;border-color:var(--olive);}
.tmpl-fields{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tmpl-fields input,.tmpl-fields select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper);}
.tmpl-fields input:focus,.tmpl-fields select:focus{outline:none;border-color:var(--olive);}
.tmpl-fields .tf-inst{flex:1;min-width:160px;}
.tmpl-fields .tf-chip{width:120px;}
.tmpl-scan-bar{background:rgba(122,132,52,.07);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);}
.tmpl-scan-bar button{background:var(--olive);color:#fff;border:none;border-radius:6px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;}
/* from-template select inside section card */
.from-tmpl-sel{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--paper);color:var(--olive-dark);cursor:pointer;}
.from-tmpl-sel:focus{outline:none;border-color:var(--olive);}
/* autocomplete */
#ac-drop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 4px 16px rgba(0,0,0,.13);z-index:1000;max-height:220px;overflow-y:auto;font-size:13px;}
#ac-drop .ac-item{padding:7px 12px;cursor:pointer;}
#ac-drop .ac-item:hover,#ac-drop .ac-item.ac-sel{background:var(--paper-2);}
#ac-drop .ac-group{padding:7px 12px 2px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
/* item picker */
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:center;justify-content:center;}
.picker-modal{background:#fff;border-radius:12px;width:min(600px,95vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);}
.picker-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.picker-head h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--olive-dark);flex:1;margin:0;}
.picker-search{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;width:190px;}
.picker-search:focus{outline:none;border-color:var(--olive);}
.picker-body{flex:1;overflow-y:auto;padding:6px 0;}
.picker-group{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 18px 3px;}
.picker-row{display:flex;align-items:center;gap:10px;padding:6px 18px;cursor:pointer;}
.picker-row:hover{background:var(--paper-2);}
.picker-row input[type=checkbox]{accent-color:var(--olive);width:15px;height:15px;flex-shrink:0;cursor:pointer;}
.picker-row .pr-name{flex:1;font-size:13px;}
.picker-row .pr-added{font-size:11px;color:var(--olive);font-weight:600;}
.picker-foot{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);}
.picker-foot .pf-count{flex:1;font-size:12px;color:var(--muted);}
.picker-cancel{background:var(--paper-2);border:1px solid var(--line);color:var(--ink);font:inherit;border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;}
.picker-done{background:var(--olive);border:none;color:#fff;font:inherit;border-radius:7px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;}
.picker-chips{padding:9px 18px;border-bottom:1px solid var(--line);}
.picker-chips .tmpl-chips{margin-bottom:0;}
.cov-chips{margin-bottom:10px;}
</style>
</head>
<body>
<header>
  <span class="logo">UNQ</span>
  <div class="tabs">
    <button data-mode="catalog" class="active">L1 · Catalog</button>
    <button data-mode="print">L2 · Print</button>
    <button data-mode="digital">L3 · Digital</button>
  </div>
  <span class="spacer"></span>
  <span id="status">Loading…</span>
  <div class="previews">
    <a href="/digital-menu/" target="_blank">Digital menu ↗</a>
    <a href="/digital-package/" target="_blank">Digital pkg ↗</a>
    <a href="/package/" target="_blank">Print pkg ↗</a>
  </div>
  <button id="save" disabled>Save &amp; rebuild</button>
</header>

<div id="catalog">
  <div class="layout">
    <div class="side" id="cats"></div>
    <div class="main" id="items"></div>
  </div>
</div>

<div id="print" class="hidden">
  <div class="layout"><div class="side" id="pkgnav"></div><div class="main" id="pkgmain"></div></div>
</div>
<div id="digital" class="hidden">
  <div class="main" id="digmain"></div>
</div>

<div id="ac-drop" style="display:none"></div>

<div id="picker-overlay" class="picker-overlay" style="display:none">
  <div class="picker-modal">
    <div class="picker-head">
      <h3 id="picker-title">Add items</h3>
      <input class="picker-search" id="picker-q" placeholder="Filter items…" autocomplete="off">
    </div>
    <div class="picker-chips" id="picker-chips"></div>
    <div class="picker-body" id="picker-body"></div>
    <div class="picker-foot">
      <span class="pf-count" id="picker-count"></span>
      <button class="picker-cancel" id="picker-cancel">Cancel</button>
      <button class="picker-done" id="picker-done">Add selected</button>
    </div>
  </div>
</div>

<script>
let DATA=null, curCat=null, LAYOUT=null, dirty=false, dirtyL=false;
const secOpen={}; // key 'pkgId:si' → true when expanded
function filterSecs(pkgEl){
  const q=(pkgEl.querySelector('#sec-filter-inp')||{value:''}).value.toLowerCase().trim();
  let vis=0,tot=0;
  pkgEl.querySelectorAll('.sec-accord').forEach(a=>{
    tot++;
    const nm=(a.querySelector('.sec-name-inp')||{value:''}).value.toLowerCase();
    const hide=q&&!nm.includes(q);
    a.style.display=hide?'none':'';
    if(!hide)vis++;
  });
  const lbl=pkgEl.querySelector('.sfc-count');
  if(lbl)lbl.textContent=q?(vis+' of '+tot):tot+' section'+(tot!==1?'s':'');
}
const $=s=>document.querySelector(s);
const byId=(arr,id)=>arr.find(x=>x.id===id);
function status(t,cls){const s=$('#status');s.textContent=t;s.className=cls||'';}
function setDirty(){dirty=true;$('#save').disabled=false;status('Unsaved changes');}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){if(v==null||String(v).trim()==='')return null;const n=Number(v);return isNaN(n)?v:n;}

async function load(){
  try{
    const r=await fetch('/api/data');const j=await r.json();
    if(!j.ok){status('Load error: '+j.error,'err');return;}
    DATA=j.data;
    try{const rl=await fetch('/api/layout');const jl=await rl.json();if(jl.ok)LAYOUT=jl.layout;}catch(_){}
    curCat=DATA.menu.categories[0] && DATA.menu.categories[0].id;
    renderCats();renderItems();status('Loaded','ok');
  }catch(e){status('Cannot reach helper app — run: python3 tools/serve.py','err');}
}

function renderCats(){
  const groups=DATA.menu.groups, cats=DATA.menu.categories, items=DATA.menu.items;
  let h='';
  groups.forEach(g=>{
    const gcats=cats.filter(c=>c.groupId===g.id);
    if(!gcats.length)return;
    h+='<div class="grp">'+esc(g.name)+'</div>';
    gcats.forEach(c=>{
      const n=items.filter(it=>it.categoryId===c.id).length;
      h+='<a data-cat="'+c.id+'" class="'+(c.id===curCat?'active':'')+'">'+esc(c.name)+'<span class="n">'+n+'</span></a>';
    });
  });
  $('#cats').innerHTML=h;
}

function renderItems(){
  const cat=byId(DATA.menu.categories,curCat);
  if(!cat){$('#items').innerHTML='';return;}
  const list=DATA.menu.items.filter(it=>it.categoryId===curCat);
  const catOpts=DATA.menu.categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  let h='<h2>'+esc(cat.name)+'</h2><div class="sub">'+list.length+' item(s) · edits here flow to every output on Save</div>';
  list.forEach(it=>{ h+=itemCard(it,catOpts); });
  h+='<button class="btn add" data-act="add-item">+ Add item</button>';
  $('#items').innerHTML=h;
}

function itemCard(it,catOpts){
  const tags=it.tags||[];
  let h='<div class="card" data-i="'+it.id+'">';
  h+='<div class="row1"><input class="iname" data-f="name" value="'+esc(it.name)+'" placeholder="Item name">';
  h+='<select data-f="categoryId" title="Move to category">'+catOpts.replace('value="'+it.categoryId+'"','value="'+it.categoryId+'" selected')+'</select>';
  h+='<button class="x" data-act="del-item" title="Delete item">✕</button></div>';
  h+='<textarea data-f="desc" placeholder="Description">'+esc(it.desc)+'</textarea>';
  h+='<div class="meta"><input class="img" data-f="img" value="'+esc(it.img)+'" placeholder="image path (menu/assets/…)">';
  h+='<label class="tag-cb"><input type="checkbox" data-f="tag-spicy" '+(tags.includes('spicy')?'checked':'')+'>🌶️ spicy</label>';
  h+='<label class="tag-cb"><input type="checkbox" data-f="tag-sweet" '+(tags.includes('sweet')?'checked':'')+'>🍬 sweet</label>';
  h+='<label class="tag-cb"><input type="checkbox" data-f="showOnDigital" '+(it.showOnDigital===false?'':'checked')+'>show on digital menu</label></div>';
  if(it.variants && it.variants.length){
    h+='<table class="vtable"><tr><th>Variant</th><th>Ingredients / note</th><th>Price</th><th></th></tr>';
    it.variants.forEach(v=>{
      h+='<tr data-v="'+v.id+'"><td><input class="vn" data-f="name" value="'+esc(v.name)+'"></td>';
      h+='<td class="ving"><input class="vi" data-f="ing" value="'+esc(v.ing)+'"></td>';
      h+='<td><input class="vp" data-f="price" value="'+esc(v.price)+'"></td>';
      h+='<td><button class="x" data-act="del-variant">✕</button></td></tr>';
    });
    h+='</table>';
  }else{
    h+='<div class="single-price">Price ₹<input class="vp" data-f="price" value="'+esc(it.price)+'"> <span style="color:var(--muted);font-size:12px">(single price — or add variants)</span></div>';
  }
  h+='<button class="btn add" data-act="add-variant">+ Add variant</button>';
  h+='</div>';
  return h;
}

// ---- event delegation: edits ----
document.addEventListener('input',e=>{
  const t=e.target; const card=t.closest('.card'); if(!card)return;
  const it=byId(DATA.menu.items,card.dataset.i); if(!it)return;
  const f=t.dataset.f; if(!f)return;
  const vrow=t.closest('tr[data-v]');
  const obj=vrow?byId(it.variants,vrow.dataset.v):it;
  if(!obj)return;
  if(f==='price'){obj.price=num(t.value);}
  else if(f==='name'||f==='ing'||f==='desc'||f==='img'){obj[f]=t.value;}
  setDirty();
});
document.addEventListener('change',e=>{
  const t=e.target; const card=t.closest('.card'); if(!card)return;
  const it=byId(DATA.menu.items,card.dataset.i); if(!it)return;
  const f=t.dataset.f;
  if(f==='categoryId'){it.categoryId=t.value;setDirty();renderCats();renderItems();}
  else if(f==='tag-spicy'||f==='tag-sweet'){
    const tag=f.split('-')[1]; it.tags=it.tags||[];
    if(t.checked){if(!it.tags.includes(tag))it.tags.push(tag);}else{it.tags=it.tags.filter(x=>x!==tag);}
    setDirty();
  }else if(f==='showOnDigital'){ it.showOnDigital=t.checked?undefined:false; if(it.showOnDigital===undefined)delete it.showOnDigital; setDirty(); }
});
// ---- event delegation: buttons ----
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act; const card=b.closest('.card');
  if(act==='add-item'){
    const id='item-'+Date.now().toString(36);
    DATA.menu.items.push({id,categoryId:curCat,name:'New item',desc:'',img:'',tags:[],price:null,variants:[]});
    setDirty();renderCats();renderItems();return;
  }
  if(!card)return;
  const it=byId(DATA.menu.items,card.dataset.i); if(!it)return;
  if(act==='del-item'){
    if(confirm('Delete "'+it.name+'"?')){DATA.menu.items=DATA.menu.items.filter(x=>x.id!==it.id);setDirty();renderCats();renderItems();}
  }else if(act==='add-variant'){
    it.variants=it.variants||[];
    it.variants.push({id:it.id+'-v'+Date.now().toString(36),name:'New variant',ing:'',price:it.price,tags:[]});
    it.price=null; setDirty(); renderItems();
  }else if(act==='del-variant'){
    const vrow=b.closest('tr[data-v]'); it.variants=it.variants.filter(v=>v.id!==vrow.dataset.v); setDirty(); renderItems();
  }
});

async function save(){
  $('#save').disabled=true; status('Saving & rebuilding…');
  try{
    if(dirty){const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});const j=await r.json();if(!j.ok)throw new Error(j.error||j.build||'data build failed');dirty=false;}
    if(dirtyL){const r=await fetch('/api/layout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(LAYOUT)});const j=await r.json();if(!j.ok)throw new Error(j.error||j.build||'layout build failed');dirtyL=false;}
    status('Saved & rebuilt all outputs ✓','ok');
  }catch(e){status('Save failed: '+e.message,'err');$('#save').disabled=false;}
}
$('#save').addEventListener('click',save);

// ===== Section template helpers =====
function tmplSelectOpts(){
  return (DATA.sectionTemplates||[]).map(t=>'<option value="'+esc(t.id)+'">'+esc(t.label||t.sectionName||'Unnamed')+'</option>').join('');
}
function renderSectionTemplates(){
  DATA.sectionTemplates=DATA.sectionTemplates||[];
  const tmpls=DATA.sectionTemplates;
  let h='<h2>Section templates</h2>';
  h+='<div class="sub">Define reusable instruction / chip / choice-type combos. In any package section, pick one from the "From template…" dropdown — fields pre-fill and stay editable.</div>';
  h+='<div class="tmpl-scan-bar">Scan all packages and import unique section configs as templates: <button id="tmpl-scan">Scan &amp; import</button><span id="tmpl-scan-msg" style="font-size:12px"></span></div>';
  if(tmpls.length===0){h+='<div class="placeholder" style="margin-bottom:14px"><h3>No templates yet</h3>Click "Scan &amp; import" to auto-populate from existing packages, or add one manually below.</div>';}
  tmpls.forEach((t,ti)=>{
    h+='<div class="tmpl-card" data-ti="'+ti+'">';
    h+='<div class="row1"><input class="tlabel" data-tf="label" placeholder="Template name (e.g. Welcome – individual pick)" value="'+esc(t.label||'')+'"><button class="x" data-tact="del" title="Delete template">✕</button></div>';
    h+='<div class="tmpl-fields">';
    h+='<input class="tf-inst" data-tf="instruction" placeholder="Instruction text" value="'+esc(t.instruction||'')+'">';
    h+='<input class="tf-chip" data-tf="chip" placeholder="Chip / qty" value="'+esc(t.chip||'')+'">';
    h+='<input style="width:140px" data-tf="sectionName" placeholder="Default section name" value="'+esc(t.sectionName||'')+'">';
    h+='<select data-tf="choiceType">'+['','individual','party'].map(o=>'<option value="'+o+'"'+(o===(t.choiceType||'')?' selected':'')+'>'+(o||'fixed')+'</option>').join('')+'</select>';
    h+='</div></div>';
  });
  h+='<button class="btn add" id="tmpl-add">+ New template</button>';
  $('#pkgmain').innerHTML=h;
  // events scoped to this view
  $('#pkgmain').querySelector('#tmpl-add').addEventListener('click',()=>{
    DATA.sectionTemplates.push({id:'st-'+Date.now().toString(36),label:'',sectionName:'',instruction:'',chip:'',choiceType:''});
    setDirty();renderSectionTemplates();
  });
  $('#pkgmain').querySelector('#tmpl-scan').addEventListener('click',()=>{
    const existing=new Set(DATA.sectionTemplates.map(t=>t.instruction+'||'+t.chip+'||'+t.choiceType));
    let added=0;
    DATA.packages.forEach(p=>{
      (p.sections||[]).forEach(s=>{
        if(!s.instruction&&!s.chip&&!s.choiceType)return;
        const key=(s.instruction||'')+'||'+(s.chip||'')+'||'+(s.choiceType||'');
        if(existing.has(key))return;
        existing.add(key);
        DATA.sectionTemplates.push({
          id:'st-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,5),
          label:(s.name||'')+(s.chip?' · '+s.chip:''),
          sectionName:s.name||'',
          instruction:s.instruction||'',
          chip:s.chip||'',
          choiceType:s.choiceType||''
        });
        added++;
      });
    });
    setDirty();
    $('#pkgmain').querySelector('#tmpl-scan-msg').textContent=added?'Imported '+added+' new template'+(added>1?'s':'')+'.':'Nothing new to import.';
    renderSectionTemplates();
  });
  // inline edit
  $('#pkgmain').addEventListener('input',e=>{
    const card=e.target.closest('[data-ti]');if(!card)return;
    const ti=+card.dataset.ti,f=e.target.dataset.tf;if(!f)return;
    DATA.sectionTemplates[ti][f]=e.target.value;setDirty();
  });
  $('#pkgmain').addEventListener('change',e=>{
    const card=e.target.closest('[data-ti]');if(!card)return;
    const ti=+card.dataset.ti,f=e.target.dataset.tf;if(!f)return;
    DATA.sectionTemplates[ti][f]=e.target.value;setDirty();
  });
  $('#pkgmain').addEventListener('click',e=>{
    const b=e.target.closest('[data-tact]');if(!b)return;
    const card=b.closest('[data-ti]');if(!card)return;
    const ti=+card.dataset.ti;
    if(b.dataset.tact==='del'){
      if(confirm('Delete template "'+esc(DATA.sectionTemplates[ti].label||'this template')+'"?')){
        DATA.sectionTemplates.splice(ti,1);setDirty();renderSectionTemplates();
      }
    }
  });
}

// ===== L2: Print authoring (packages + venue) =====
let curPkg=null;
function catOptions(){
  let o='<option value="">+ add item…</option>';
  DATA.menu.items.forEach(it=>{
    if(it.variants && it.variants.length){
      it.variants.forEach(v=>{o+='<option value="'+it.id+'::'+v.id+'">'+esc(it.name+' – '+v.name)+'</option>';});
    }else{o+='<option value="'+it.id+'::">'+esc(it.name)+'</option>';}
  });
  return o;
}
function nameFor(itemId,variantId){
  const it=byId(DATA.menu.items,itemId); if(!it)return '';
  if(variantId){const v=byId(it.variants||[],variantId);return it.name+' – '+(v?v.name:'');}
  return it.name;
}
function renderPrint(){
  if(!DATA)return;
  if(curPkg===null)curPkg=(DATA.packages[0]&&DATA.packages[0].id)||'venue';
  let h='<div class="grp">Packages</div>';
  DATA.packages.forEach(p=>{h+='<a data-gopkg="'+p.id+'" class="'+(p.id===curPkg?'active':'')+'">'+esc(p.name)+'<span class="n">₹'+esc(p.price)+'</span></a>';});
  h+='<a data-gopkg="__add" style="color:var(--olive);font-weight:600">+ Add package</a>';
  h+='<div class="grp">Views</div>';
  h+='<a data-gopkg="coverage" class="'+(curPkg==='coverage'?'active':'')+'">Coverage map</a>';
  h+='<a data-gopkg="compare" class="'+(curPkg==='compare'?'active':'')+'">Compare sections</a>';
  h+='<a data-gopkg="sidebyside" class="'+(curPkg==='sidebyside'?'active':'')+'">Side by side</a>';
  h+='<a data-gopkg="priceanalyser" class="'+(curPkg==='priceanalyser'?'active':'')+'">Price analyser</a>';
  h+='<div class="grp">Library</div>';
  h+='<a data-gopkg="sectmpl" class="'+(curPkg==='sectmpl'?'active':'')+'">Section templates<span class="n">'+(DATA.sectionTemplates||[]).length+'</span></a>';
  h+='<div class="grp">Other</div><a data-gopkg="venue" class="'+(curPkg==='venue'?'active':'')+'">Venue page</a>';
  h+='<a data-gopkg="layout" class="'+(curPkg==='layout'?'active':'')+'">Print menu layout</a>';
  $('#pkgnav').innerHTML=h;
  if(curPkg==='venue'){$('#pkgmain').innerHTML=venueEditor();}
  else if(curPkg==='layout'){renderLayout();}
  else if(curPkg==='coverage'){renderCoverage();}
  else if(curPkg==='compare'){renderCompare();}
  else if(curPkg==='sidebyside'){renderSideBySide();}
  else if(curPkg==='priceanalyser'){renderPriceAnalyser();}
  else if(curPkg==='sectmpl'){renderSectionTemplates();}
  else{$('#pkgmain').innerHTML=packageEditor(byId(DATA.packages,curPkg));}
}
function packageEditor(p){
  if(!p)return '<p>Select a package.</p>';
  const tmpls=DATA.sectionTemplates||[];
  let h='<div data-pkg="'+p.id+'">';
  h+='<h2><input data-pf="name" value="'+esc(p.name)+'" style="font:inherit;font-size:24px;border:none;background:transparent;color:var(--olive-dark);width:70%"></h2>';
  h+='<div class="sub">Edits here flow to the print package &amp; digital package on Save.</div>';
  h+='<div class="card"><div class="meta"><label>Package #<input data-pf="number" value="'+esc(p.number)+'" style="width:50px"></label>';
  h+='<label>Price ₹<input data-pf="price" value="'+esc(p.price)+'" style="width:70px"></label></div>';
  h+='<textarea data-pf="description" placeholder="Description">'+esc(p.description)+'</textarea>';
  h+='<input data-pf="idealValue" style="width:100%;margin-top:8px" placeholder="Ideal for (· separated)" value="'+esc(p.idealValue)+'">';
  h+='<input data-pf="waterNote" style="width:100%;margin-top:8px" placeholder="Water / highlight note" value="'+esc(p.waterNote)+'"></div>';
  // Section filter bar
  const nsec=(p.sections||[]).length;
  h+='<div class="sec-filter-bar"><input id="sec-filter-inp" placeholder="Filter sections…" autocomplete="off"><span class="sfc-count">'+nsec+' section'+(nsec!==1?'s':'')+'</span></div>';
  // Sections accordion
  (p.sections||[]).forEach((s,si)=>{
    const key=p.id+':'+si;
    const isOpen=!!secOpen[key];
    const instr=s.instruction||'';const chip=s.chip||'';const ctype=s.choiceType||'';
    const instrP=instr?'<span class="spill">'+esc(instr.length>26?instr.slice(0,24)+'…':instr)+'</span>':'';
    const chipP=chip?'<span class="spill">'+esc(chip)+'</span>':'';
    const typeP=ctype?'<span class="spill type">'+esc(ctype)+'</span>':'';
    const nit=(s.items||[]).length;
    h+='<div class="sec-accord'+(isOpen?' open':'')+'" data-sec="'+si+'">';
    // header row
    h+='<div class="sec-row">';
    h+='<button class="mv-sec" data-act2="sec-up" title="Move up">↑</button>';
    h+='<button class="mv-sec" data-act2="sec-down" title="Move down">↓</button>';
    h+='<input class="sec-name-inp" data-sf="name" value="'+esc(s.name)+'" placeholder="Section name">';
    h+='<span class="sec-pills">'+instrP+chipP+typeP+'<span class="spill cnt">'+nit+' item'+(nit!==1?'s':'')+'</span></span>';
    h+='<button class="sec-chevron" data-act2="toggle-sec" title="Expand / collapse">›</button>';
    h+='<button class="x" data-act2="del-sec" title="Delete section">✕</button>';
    h+='</div>';
    // expanded body
    h+='<div class="sec-body">';
    if(tmpls.length){
      h+='<div class="tmpl-chips"><span class="tc-label">Template:</span>';
      tmpls.forEach(t=>{h+='<button class="tc" data-act2="apply-tmpl" data-tmpl-id="'+esc(t.id)+'">'+esc(t.label||t.sectionName||'Unnamed')+'</button>';});
      h+='</div>';
    }
    h+='<div class="sec-fields">';
    h+='<input class="sf-inst" data-sf="instruction" placeholder="Instruction text" value="'+esc(instr)+'">';
    h+='<input class="sf-chip" data-sf="chip" placeholder="Chip / qty" value="'+esc(chip)+'">';
    h+='<select data-sf="choiceType">'+['','individual','party'].map(o=>'<option value="'+o+'"'+(o===ctype?' selected':'')+'>'+(o||'fixed')+'</option>').join('')+'</select>';
    h+='</div>';
    (s.items||[]).forEach((it,ii)=>{
      h+='<div class="item-row" data-pi="'+ii+'">';
      h+='<button class="mv" data-act2="item-up" title="Move up">↑</button>';
      h+='<button class="mv" data-act2="item-down" title="Move down">↓</button>';
      h+='<input class="idn" data-itf="displayName" value="'+esc(it.displayName)+'" placeholder="Item name">';
      h+='<input class="inote" data-itf="note" placeholder="badge / note" value="'+esc(it.note||it.badge||'')+'">';
      h+='<button class="x" data-act2="del-item">✕</button>';
      h+='</div>';
    });
    h+='<button class="btn add" data-act2="open-picker" style="margin-top:8px">+ Add items…</button>';
    h+='</div></div>'; // sec-body + sec-accord
  });
  h+='<button class="btn add" data-act2="add-sec">+ Add section</button>';
  h+='<div class="card"><b style="font-size:13px">Booking</b>';
  Object.keys(p.booking||{}).forEach(k=>{h+='<div class="meta brow"><input class="bk" value="'+esc(k)+'" style="width:130px"><input class="bv" value="'+esc(p.booking[k])+'" style="flex:1"><button class="x" data-act2="del-book">✕</button></div>';});
  h+='<button class="btn add" data-act2="add-book">+ row</button></div>';
  h+='<div class="card"><b style="font-size:13px">Terms</b>';
  (p.terms||[]).forEach((tm,ti)=>{h+='<div class="meta"><input data-term="'+ti+'" style="flex:1" value="'+esc(tm)+'"><button class="x" data-act2="del-term">✕</button></div>';});
  h+='<button class="btn add" data-act2="add-term">+ term</button></div>';
  h+='<div class="card"><b style="font-size:13px">Cancellation</b>';
  (p.cancellation||[]).forEach((c,ci)=>{h+='<div class="meta" data-cidx="'+ci+'"><input data-cf="when" style="flex:1" value="'+esc(c.when)+'"><input data-cf="result" style="width:140px" value="'+esc(c.result)+'"><button class="x" data-act2="del-cancel">✕</button></div>';});
  h+='<button class="btn add" data-act2="add-cancel">+ row</button></div>';
  h+='<button class="btn" data-act2="del-pkg" style="color:var(--danger);border-color:var(--danger)">Delete package</button></div>';
  return h;
}
function venueEditor(){
  const v=DATA.venuePage||(DATA.venuePage={subtitle:'',sections:[]}); v.sections=v.sections||[];
  let h='<div data-venue="1"><h2>Venue page</h2><div class="sub">The last page of the print package.</div>';
  h+='<div class="card"><input data-vf="subtitle" style="width:100%" value="'+esc(v.subtitle)+'" placeholder="subtitle"></div>';
  v.sections.forEach((s,si)=>{
    h+='<div class="card" data-vsec="'+si+'"><div class="row1"><input data-vsf="name" class="iname" value="'+esc(s.name)+'"><button class="x" data-act2="del-vsec">✕</button></div>';
    h+='<div class="meta"><input data-vsf="instruction" style="flex:1" placeholder="detail (e.g. 600 sq ft)" value="'+esc(s.instruction)+'"><input data-vsf="chip" style="flex:1" placeholder="chip (e.g. Up to 40 guests)" value="'+esc(s.chip)+'"></div>';

// ===== Coverage map =====
let covActiveCats=new Set();
let covActiveItems=new Set();
let covCollapsed=new Set();      // collapsed item ids
let covCollapsedCats=new Set();  // collapsed category ids
let covSectionFilter=null;       // null = all sections, string = filter by section name

function renderCoverage(){
  const pkgs=DATA.packages;
  // full coverage map (used for cell display)
  const covered=pkgs.map(p=>{
    const m=new Map();
    (p.sections||[]).forEach((sec,si)=>(sec.items||[]).forEach(it=>(it.refs||[]).forEach(r=>{
      const k=r.itemId+'::'+(r.variantId||'');
      if(!m.has(k))m.set(k,si);
    })));
    return m;
  });
  // section-filtered coverage map (used for badge counts only)
  const covBadge=covSectionFilter?pkgs.map(p=>{
    const m=new Map();
    (p.sections||[]).forEach((sec,si)=>{
      if((sec.name||'(unnamed)')!==covSectionFilter)return;
      (sec.items||[]).forEach(it=>(it.refs||[]).forEach(r=>{
        const k=r.itemId+'::'+(r.variantId||'');
        if(!m.has(k))m.set(k,si);
      }));
    });
    return m;
  }):covered;
  // per-category item count per package (for grp-row badges)
  const itemCatMap={};
  DATA.menu.items.forEach(it=>itemCatMap[it.id]=it.categoryId);
  const catCovCounts={};
  DATA.menu.categories.forEach(cat=>catCovCounts[cat.id]=new Array(pkgs.length).fill(0));
  covBadge.forEach((covMap,pi)=>{
    covMap.forEach((_,key)=>{
      const itemId=key.split('::')[0];
      const catId=itemCatMap[itemId];
      if(catId&&catCovCounts[catId])catCovCounts[catId][pi]++;
    });
  });

  let h='<div class="cov-hd"><h2>Coverage map</h2><div class="cov-toolbar"><button class="btn" data-covact="expand-all">Expand all</button><button class="btn" data-covact="collapse-all">Collapse all</button></div></div>';
  h+='<div class="sub">Click a cell to assign a section; "— None —" to remove. Click ▼/▶ on a section or item row to collapse it.</div>';

  // Row 1: category chips
  h+='<div class="cov-chips tmpl-chips">';
  DATA.menu.groups.forEach(g=>{
    const gcats=DATA.menu.categories.filter(c=>c.groupId===g.id);
    if(!gcats.length)return;
    h+='<span class="tc-label">'+esc(g.name)+':</span>';
    gcats.forEach(cat=>{
      const active=covActiveCats.has(cat.id)?' active':'';
      h+='<button type="button" class="tc'+active+'" data-cat="'+esc(cat.id)+'">'+esc(cat.name)+'</button>';
    });
  });
  h+='</div>';

  // Row 2: item chips (only multi-variant items, scoped to visible categories)
  const visCats=covActiveCats.size?DATA.menu.categories.filter(c=>covActiveCats.has(c.id)):DATA.menu.categories;
  const chipItems=DATA.menu.items.filter(it=>visCats.some(c=>c.id===it.categoryId)&&it.variants&&it.variants.length>1);
  if(chipItems.length){
    h+='<div class="cov-chips cov-item-chips tmpl-chips">';
    const seen=new Set();
    chipItems.forEach(it=>{
      const cat=DATA.menu.categories.find(c=>c.id===it.categoryId);
      if(cat&&!seen.has(cat.id)){seen.add(cat.id);h+='<span class="tc-label">'+esc(cat.name)+':</span>';}
      const active=covActiveItems.has(it.id)?' active':'';
      h+='<button type="button" class="tc tc-sm'+active+'" data-itchip="'+esc(it.id)+'">'+esc(it.name)+'</button>';
    });
    h+='</div>';
  }

  // Row 3: section filter chips (single-select)
  const secNames=[...new Set(pkgs.flatMap(p=>(p.sections||[]).map(s=>s.name||'(unnamed)')))].sort();
  if(secNames.length){
    h+='<div class="cov-chips cov-sec-chips tmpl-chips">';
    h+='<span class="tc-label">Section:</span>';
    h+='<button type="button" class="tc tc-sm'+(covSectionFilter===null?' active':'')+'" data-secfilter="">All</button>';
    secNames.forEach(n=>{
      const active=covSectionFilter===n?' active':'';
      h+='<button type="button" class="tc tc-sm'+active+'" data-secfilter="'+esc(n)+'">'+esc(n)+'</button>';
    });
    h+='</div>';
  }

  // Table
  const cols=pkgs.length+1;
  h+='<div class="cov-wrap"><table class="cov-table"><thead><tr><th>Item</th>';
  pkgs.forEach(p=>{h+='<th class="pkg" data-gopkg2="'+p.id+'" title="Jump to '+esc(p.name)+'">'+esc(p.name.length>12?p.name.slice(0,11)+'…':p.name)+'<span class="cov-pkg-price">₹'+esc(p.price)+'</span></th>';});
  h+='</tr></thead><tbody>';

  const groups=DATA.menu.groups, cats=DATA.menu.categories, allItems=DATA.menu.items;
  groups.forEach(g=>{
    let gcats=cats.filter(c=>c.groupId===g.id);
    if(covActiveCats.size)gcats=gcats.filter(c=>covActiveCats.has(c.id));
    gcats.forEach(cat=>{
      let catItems=allItems.filter(it=>it.categoryId===cat.id);
      if(covActiveItems.size)catItems=catItems.filter(it=>covActiveItems.has(it.id));
      if(!catItems.length)return;
      const catCollapsed=covCollapsedCats.has(cat.id);
      const counts=catCovCounts[cat.id]||[];
      h+='<tr class="grp-row" data-catid="'+esc(cat.id)+'" id="cg-'+esc(cat.id)+'"><td><span class="it-toggle">'+(catCollapsed?'▶':'▼')+'</span>'+esc(g.name+' › '+cat.name)+'</td>';
      pkgs.forEach((_,pi)=>{const n=counts[pi]||0;h+='<td class="grp-pkg-cell">'+(n?'<span class="cov-grp-badge">'+n+'</span>':'')+'</td>';});
      h+='</tr>';
      if(!catCollapsed)catItems.forEach(it=>{
        const collapsed=covCollapsed.has(it.id);
        if(it.variants&&it.variants.length){
          const itCounts=pkgs.map((_,pi)=>{
            if(covBadge[pi].has(it.id+'::'))return it.variants.length;
            return it.variants.filter(v=>covBadge[pi].has(it.id+'::'+v.id)).length;
          });
          h+='<tr class="it-hdr" data-itid="'+esc(it.id)+'"><td><span class="it-toggle">'+(collapsed?'▶':'▼')+'</span>'+esc(it.name)+'</td>';
          pkgs.forEach((_,pi)=>{const n=itCounts[pi];h+='<td class="grp-pkg-cell">'+(n?'<span class="cov-grp-badge it-badge">'+n+'</span>':'')+'</td>';});
          h+='</tr>';
          if(!collapsed){
            it.variants.forEach(v=>{
              const key=it.id+'::'+v.id;
              const vp=v.price!=null?'₹'+v.price:'—';
              h+='<tr class="var-row"><td class="var-name">'+esc(v.name)+'<span class="cov-item-price">'+vp+'</span></td>';
              pkgs.forEach((p,pi)=>{
                const si=covered[pi].has(key)?covered[pi].get(key):(covered[pi].has(it.id+'::')?covered[pi].get(it.id+'::'):-1);
                const has=si>=0;
                const secName=has?((p.sections[si]&&p.sections[si].name)||'(unnamed)'):'';
                const dimmed=has&&covSectionFilter&&secName!==covSectionFilter;
                h+='<td class="chk'+(has?' covered':'')+(dimmed?' cov-dimmed':'')+'" data-pkgidx="'+pi+'" data-itemid="'+esc(it.id)+'" data-variantid="'+esc(v.id)+'" data-secidx="'+si+'" title="'+esc(p.name)+(has?' — '+esc(secName)+' — click to change':' — click to add')+'">'+(has?'<span class="cov-sec">'+esc(secName)+'</span>':'')+'</td>';
              });
              h+='</tr>';
            });
          }
        }else{
          const key=it.id+'::';
          const ip=it.price!=null?'₹'+it.price:'—';
          h+='<tr><td>'+esc(it.name)+'<span class="cov-item-price">'+ip+'</span></td>';
          pkgs.forEach((p,pi)=>{
            const si=covered[pi].has(key)?covered[pi].get(key):-1;
            const has=si>=0;
            const secName=has?((p.sections[si]&&p.sections[si].name)||'(unnamed)'):'';
            const dimmed=has&&covSectionFilter&&secName!==covSectionFilter;
            h+='<td class="chk'+(has?' covered':'')+(dimmed?' cov-dimmed':'')+'" data-pkgidx="'+pi+'" data-itemid="'+esc(it.id)+'" data-variantid="" data-secidx="'+si+'" title="'+esc(p.name)+(has?' — '+esc(secName)+' — click to change':' — click to add')+'">'+(has?'<span class="cov-sec">'+esc(secName)+'</span>':'')+'</td>';
          });
          h+='</tr>';
        }
      });
    });
  });
  h+='</tbody></table></div>';
  $('#pkgmain').innerHTML=h;

  // collapse-all / expand-all toolbar
  $('#pkgmain').querySelectorAll('[data-covact]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(b.dataset.covact==='collapse-all'){
        DATA.menu.categories.forEach(c=>covCollapsedCats.add(c.id));
        DATA.menu.items.filter(it=>it.variants&&it.variants.length).forEach(it=>covCollapsed.add(it.id));
      }else{
        covCollapsedCats.clear();
        covCollapsed.clear();
      }
      renderCoverage();
    });
  });
  // grp-row click → toggle category collapse
  $('#pkgmain').querySelectorAll('tr.grp-row[data-catid]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const id=tr.dataset.catid;
      if(covCollapsedCats.has(id))covCollapsedCats.delete(id);else covCollapsedCats.add(id);
      renderCoverage();
    });
  });
  // section filter chip (single-select)
  $('#pkgmain').querySelectorAll('[data-secfilter]').forEach(b=>{
    b.addEventListener('click',()=>{
      const v=b.dataset.secfilter;
      covSectionFilter=v===''?null:v;
      renderCoverage();
    });
  });
  // category chip toggle
  $('#pkgmain').querySelectorAll('[data-cat]').forEach(b=>{
    b.addEventListener('click',()=>{
      const id=b.dataset.cat;
      if(covActiveCats.has(id))covActiveCats.delete(id);else covActiveCats.add(id);
      renderCoverage();
    });
  });
  // item chip toggle
  $('#pkgmain').querySelectorAll('[data-itchip]').forEach(b=>{
    b.addEventListener('click',()=>{
      const id=b.dataset.itchip;
      if(covActiveItems.has(id))covActiveItems.delete(id);else covActiveItems.add(id);
      renderCoverage();
    });
  });
  // item header row → collapse / expand
  $('#pkgmain').querySelectorAll('.it-hdr').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const id=tr.dataset.itid;
      if(covCollapsed.has(id))covCollapsed.delete(id);else covCollapsed.add(id);
      renderCoverage();
    });
  });
  // package header → jump to package editor
  $('#pkgmain').querySelectorAll('th[data-gopkg2]').forEach(th=>{
    th.addEventListener('click',()=>{curPkg=th.dataset.gopkg2;renderPrint();});
  });
  // cell click → section dropdown
  $('#pkgmain').querySelectorAll('td.chk').forEach(td=>{
    td.addEventListener('click',e=>{
      e.stopPropagation();
      const pkg=pkgs[+td.dataset.pkgidx];
      const itemId=td.dataset.itemid, variantId=td.dataset.variantid||null;
      const curSecIdx=+td.dataset.secidx;
      openCovPopover(td,pkg,itemId,variantId,curSecIdx);
    });
  });
}

// remove an item/variant ref from every section of a package
function removeFromSections(pkg,itemId,variantId){
  (pkg.sections||[]).forEach(sec=>{
    sec.items=(sec.items||[]).filter(it=>!(it.refs||[]).some(r=>r.itemId===itemId&&((r.variantId||null)===variantId||(variantId&&!r.variantId))));
  });
}

// small popover to pick which section of a package an item/variant belongs to (or none)
let covPopoverEl=null;
function closeCovPopover(){if(covPopoverEl){covPopoverEl.remove();covPopoverEl=null;}}
function openCovPopover(td,pkg,itemId,variantId,curSecIdx){
  closeCovPopover();
  const pop=document.createElement('div');
  pop.className='cov-popover';
  const sections=pkg.sections||[];
  let h='<div class="cov-pop-title">Section in '+esc(pkg.name)+'</div>';
  h+='<button type="button" class="'+(curSecIdx===-1?'cov-pop-active':'')+'" data-secidx="-1">— None —</button>';
  if(!sections.length){
    h+='<div class="cov-pop-empty">No sections yet — add one in the package editor first.</div>';
  }else{
    sections.forEach((sec,si)=>{h+='<button type="button" class="'+(si===curSecIdx?'cov-pop-active':'')+'" data-secidx="'+si+'">'+esc(sec.name||'(unnamed section)')+'</button>';});
  }
  pop.innerHTML=h;
  document.body.appendChild(pop);
  const r=td.getBoundingClientRect();
  pop.style.position='fixed';
  pop.style.top=Math.min(r.bottom+4,window.innerHeight-pop.offsetHeight-8)+'px';
  pop.style.left=Math.min(r.left,window.innerWidth-pop.offsetWidth-8)+'px';
  covPopoverEl=pop;
  pop.querySelectorAll('button[data-secidx]').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      const target=+b.dataset.secidx;
      if(target===curSecIdx){closeCovPopover();return;}
      removeFromSections(pkg,itemId,variantId);
      if(target>=0){
        const sec=sections[target];
        sec.items=sec.items||[];
        sec.items.push({refs:[{itemId,variantId}],displayName:nameFor(itemId,variantId),note:'',badge:''});
      }
      setDirty();
      closeCovPopover();
      renderCoverage();
    });
  });
}
document.addEventListener('click',e=>{
  if(covPopoverEl&&!covPopoverEl.contains(e.target))closeCovPopover();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeCovPopover();
});

// ===== Compare sections =====
let cmpSection='';
function allSectionNames(){
  const names=new Set();
  DATA.packages.forEach(p=>(p.sections||[]).forEach(s=>{if(s.name)names.add(s.name);}));
  return [...names].sort();
}
function renderCompare(){
  const names=allSectionNames();
  if(!cmpSection&&names.length)cmpSection=names[0];
  let h='<h2>Compare sections</h2><div class="sub">See and edit the same section across all packages at once.</div>';
  h+='<div class="cmp-bar"><label>Section:</label><select id="cmp-sel">';
  names.forEach(n=>{h+='<option value="'+esc(n)+'"'+(n===cmpSection?' selected':'')+'>'+esc(n)+'</option>';});
  h+='</select></div>';
  if(!cmpSection){$('#pkgmain').innerHTML=h+'<div class="placeholder">No sections found.</div>';return;}
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;">';
  DATA.packages.forEach(p=>{
    const si=(p.sections||[]).findIndex(s=>s.name===cmpSection);
    h+='<div data-cmppkg="'+p.id+'" data-cmpsi="'+si+'">';
    h+='<div class="cmp-pkg-head">'+esc(p.name)+'</div>';
    if(si<0){
      h+='<div style="color:var(--muted);font-size:13px;margin-bottom:8px">No "'+esc(cmpSection)+'" section</div>';
      h+='<button class="btn" data-cmpact="add-sec">+ Add this section</button>';
    }else{
      const s=p.sections[si];
      h+='<div class="card">';
      h+='<div class="meta"><input data-csf="instruction" style="flex:1" placeholder="instruction" value="'+esc(s.instruction)+'"><input data-csf="chip" style="width:110px" placeholder="chip / qty" value="'+esc(s.chip)+'"></div>';
      h+='<div class="meta" style="margin-top:6px"><label style="font-size:12px;color:var(--muted)">Choice type: </label><select data-csf="choiceType">'+['','individual','party'].map(o=>'<option value="'+o+'"'+(o===(s.choiceType||'')?' selected':'')+'>'+(o||'fixed')+'</option>').join('')+'</select></div>';
      (s.items||[]).forEach((it,ii)=>{
        h+='<div class="meta" data-cpi="'+ii+'"><input data-citf="displayName" style="flex:1" value="'+esc(it.displayName)+'"><input data-citf="note" style="width:100px" placeholder="note/badge" value="'+esc(it.note||it.badge||'')+'"><button class="x" data-cmpact="del-item">✕</button></div>';
      });
      h+='<button class="btn add" data-cmpact="open-picker" style="margin-top:8px">+ Add items…</button>';
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  $('#pkgmain').innerHTML=h;
}
// Compare sections: section picker change
$('#pkgmain').addEventListener('change',e=>{
  if(e.target.id==='cmp-sel'){cmpSection=e.target.value;renderCompare();return;}
  // inline editing
  const wrap=e.target.closest('[data-cmppkg]'); if(!wrap)return;
  const p=byId(DATA.packages,wrap.dataset.cmppkg); if(!p)return;
  const si=+wrap.dataset.cmpsi; if(si<0)return;
  const s=p.sections[si];
  if(e.target.dataset.csf){s[e.target.dataset.csf]=e.target.value;setDirty();return;}
  if(e.target.dataset.cmpact==='add-item'&&e.target.value){
    const parts=e.target.value.split('::');
    s.items.push({refs:[{itemId:parts[0],variantId:parts[1]||null}],displayName:nameFor(parts[0],parts[1]||null),note:'',badge:''});
    setDirty();renderCompare();
  }
});
$('#pkgmain').addEventListener('input',e=>{
  const wrap=e.target.closest('[data-cmppkg]'); if(!wrap)return;
  const p=byId(DATA.packages,wrap.dataset.cmppkg); if(!p)return;
  const si=+wrap.dataset.cmpsi; if(si<0)return;
  const s=p.sections[si];
  if(e.target.dataset.csf){s[e.target.dataset.csf]=e.target.value;setDirty();return;}
  const ir=e.target.closest('[data-cpi]');
  if(ir&&e.target.dataset.citf){s.items[+ir.dataset.cpi][e.target.dataset.citf]=e.target.value;setDirty();}
});
$('#pkgmain').addEventListener('click',e=>{
  const b=e.target.closest('[data-cmpact]'); if(!b)return;
  const act=b.dataset.cmpact;
  const wrap=b.closest('[data-cmppkg]'); if(!wrap)return;
  const p=byId(DATA.packages,wrap.dataset.cmppkg); if(!p)return;
  if(act==='add-sec'){
    p.sections.push({name:cmpSection,instruction:'',chip:'',choiceType:'',items:[]});
    setDirty();renderCompare();return;
  }
  if(act==='open-picker'){const csi=+wrap.dataset.cmpsi;if(csi>=0)openPicker(p,csi,renderCompare);return;}
  const si=+wrap.dataset.cmpsi; if(si<0)return;
  const s=p.sections[si];
  if(act==='del-item'){const ir=b.closest('[data-cpi]');s.items.splice(+ir.dataset.cpi,1);setDirty();renderCompare();}
});

$('#print').addEventListener('input',e=>{const t=e.target;
  if(t.id==='sec-filter-inp'){const pe=t.closest('[data-pkg]');if(pe)filterSecs(pe);return;}
  const pe=t.closest('[data-pkg]');const ve=t.closest('[data-venue]');
  if(pe){const p=byId(DATA.packages,pe.dataset.pkg);if(!p)return;
    if(t.dataset.pf){p[t.dataset.pf]=(t.dataset.pf==='price'||t.dataset.pf==='number')?num(t.value):t.value;setDirty();return;}
    const sc=t.closest('[data-sec]');
    if(sc){const s=p.sections[+sc.dataset.sec];
      if(t.dataset.sf){s[t.dataset.sf]=t.value;setDirty();return;}
      const ir=t.closest('[data-pi]');
      if(ir&&t.dataset.itf){s.items[+ir.dataset.pi][t.dataset.itf]=t.value;setDirty();return;}}
    if(t.classList.contains('bk')||t.classList.contains('bv')){recollectBooking(pe,p);setDirty();return;}
    if(t.dataset.term!=null){p.terms[+t.dataset.term]=t.value;setDirty();return;}
    const cr=t.closest('[data-cidx]');
    if(cr&&t.dataset.cf){p.cancellation[+cr.dataset.cidx][t.dataset.cf]=t.value;setDirty();return;}}
  if(ve){const v=DATA.venuePage;
    if(t.dataset.vf){v[t.dataset.vf]=t.value;setDirty();return;}
    const sc=t.closest('[data-vsec]');
    if(sc){const s=v.sections[+sc.dataset.vsec];
      if(t.dataset.vsf){s[t.dataset.vsf]=t.value;setDirty();return;}
      const ir=t.closest('[data-vi]');
      if(ir&&t.dataset.vif){s.items[+ir.dataset.vi][t.dataset.vif]=t.value;setDirty();return;}}}
});
$('#print').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.sf==='choiceType'){const pe=t.closest('[data-pkg]');const sc=t.closest('[data-sec]');byId(DATA.packages,pe.dataset.pkg).sections[+sc.dataset.sec].choiceType=t.value;setDirty();}
});
$('#print').addEventListener('click',e=>{const b=e.target.closest('[data-act2]');if(!b)return;const act=b.dataset.act2;const pe=b.closest('[data-pkg]');const ve=b.closest('[data-venue]');
  if(pe){const p=byId(DATA.packages,pe.dataset.pkg);const sc=b.closest('[data-sec]');
    if(act==='add-sec'){p.sections.push({name:'New section',instruction:'',chip:'',choiceType:'',items:[]});secOpen[p.id+':'+(p.sections.length-1)]=true;}
    else if(act==='del-sec')p.sections.splice(+sc.dataset.sec,1);

    else if(act==='open-picker'){if(sc&&p){openPicker(p,+sc.dataset.sec,renderPrint);return;}}
    else if(act==='add-book'){p.booking=p.booking||{};let k='New',i=1;while(p.booking[k])k='New '+(++i);p.booking[k]='';}

    else return;
    setDirty();renderPrint();return;}
  if(ve){const v=DATA.venuePage;const sc=b.closest('[data-vsec]');
    if(act==='add-vsec')v.sections.push({name:'New',instruction:'',chip:'',items:[]});
    else if(act==='del-vsec')v.sections.splice(+sc.dataset.vsec,1);

    else return;

// ===== Price analyser =====
let priceAnPkg=null;
// per-section overrides keyed by "pkgId:si"
const paOverrides={};

function _catalogPrice(itemId,variantId){
  const it=byId(DATA.menu.items,itemId);if(!it)return null;
  if(variantId&&it.variants){const v=byId(it.variants,variantId);return v?v.price:null;}
  return it.price!=null?it.price:null;
}
function _parseN(chip){const m=(chip||'').match(/\d+/);return m?+m[0]:null;}
function _sectionCost(s,ov){
  // ov = {choices, sharing} overrides
  const type=s.choiceType||'fixed';
  // resolve choices / sharing from chip then override
  let choices=1, sharing=1;
  if(type==='individual'){
    choices=_parseN(s.chip)||1;
  }else if(type==='party'){
    // "round table · 2 pax", "shared / 3", etc.
    const m=(s.chip||'').match(/(\d+)\s*(?:pax|p\b|person|people)/i);
    sharing=m?+m[1]:2;
  }
  // apply overrides
  if(ov&&ov.choices!=null)choices=+ov.choices;
  if(ov&&ov.sharing!=null)sharing=+ov.sharing;

  const priced=(s.items||[]).map(it=>{
    const ref=(it.refs||[])[0]||{};
    const price=_catalogPrice(ref.itemId,ref.variantId||null);
    return{displayName:it.displayName,price,ref};
  });
  const prices=priced.filter(x=>x.price!=null).map(x=>x.price).sort((a,b)=>b-a);

  let costPerPerson=0;
  if(type==='fixed'){
    costPerPerson=prices.reduce((a,b)=>a+b,0);
  }else if(type==='individual'){
    // worst-case: guest picks the `choices` most expensive
    costPerPerson=prices.slice(0,choices).reduce((a,b)=>a+b,0);
  }else{
    // party: most expensive dish divided by sharing factor
    costPerPerson=prices.length>0?prices[0]/sharing:0;
  }
  return{type,choices,sharing,priced,costPerPerson};
}

function renderPriceAnalyser(){
  if(!priceAnPkg)priceAnPkg=DATA.packages[0]&&DATA.packages[0].id;
  const p=byId(DATA.packages,priceAnPkg);
  const pkgOpts=DATA.packages.map(x=>'<option value="'+x.id+'"'+(x.id===priceAnPkg?' selected':'')+'>'+esc(x.name)+'</option>').join('');
  let h='<h2>Price analyser</h2><div class="sub">Estimates cost/person per section based on serving mode. Override choices/sharing inline.</div>';
  h+='<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px"><label style="font-size:13px;color:var(--muted)">Package:</label><select id="pa-pkg">'+pkgOpts+'</select></div>';
  if(!p){$('#pkgmain').innerHTML=h;return;}

  const pkgPrice=+(p.price)||0;
  const numSecs=(p.sections||[]).length||1;
  // first pass — compute totals
  let totalCost=0;
  const secInfos=(p.sections||[]).map((s,si)=>{
    const ov=paOverrides[p.id+':'+si]||{};
    const info=_sectionCost(s,ov);
    totalCost+=info.costPerPerson;
    return info;
  });
  const margin=pkgPrice-totalCost;
  const marginColor=Math.abs(margin)<30?'var(--olive)':margin<0?'var(--danger)':'var(--ink)';

  h+='<div class="pa-header">';
  h+='<div class="pa-stat"><div class="lbl">Package price</div><div class="val">₹'+pkgPrice+'</div></div>';
  h+='<div class="pa-stat"><div class="lbl">Est. cost/person</div><div class="val" style="color:'+marginColor+'">₹'+Math.round(totalCost)+'</div></div>';
  h+='<div class="pa-stat"><div class="lbl">Margin</div><div class="val" style="color:'+marginColor+'">'+(margin>=0?'+':'')+'₹'+Math.round(margin)+'</div></div>';
  h+='<div style="flex:1;font-size:12px;color:var(--muted)">Worst-case (guest picks priciest choices). Positive margin = room to spare.</div>';
  h+='</div>';

  const sectionBudget=numSecs>0?pkgPrice/numSecs:pkgPrice;

  (p.sections||[]).forEach((s,si)=>{
    const info=secInfos[si];
    const ov=paOverrides[p.id+':'+si]||{};
    const modeLabel=info.type==='individual'?'Individual · choose '+info.choices
      :info.type==='party'?'Party · shared ÷'+info.sharing
      :'Fixed (all)';

    h+='<div class="pa-sec" data-pasi="'+si+'" data-papkg="'+p.id+'">';
    h+='<div class="pa-sec-head"><span class="sname">'+esc(s.name)+'</span>';
    h+='<span class="smode">'+esc(modeLabel)+'</span>';
    h+='<span class="scost">~₹'+Math.round(info.costPerPerson)+'/person</span></div>';

    // override inputs
    h+='<div class="pa-overrides">';
    if(info.type==='individual'){
      h+='<label>Choices per person: <input type="number" class="pa-ov" data-ov="choices" min="1" value="'+(ov.choices!=null?ov.choices:info.choices)+'"></label>';
    }else if(info.type==='party'){
      h+='<label>People sharing 1 plate: <input type="number" class="pa-ov" data-ov="sharing" min="1" value="'+(ov.sharing!=null?ov.sharing:info.sharing)+'"></label>';
    }
    h+='<label>Section budget share: <b>₹'+Math.round(sectionBudget)+'</b></label>';
    h+='</div>';

    h+='<table class="pa-tbl"><thead><tr><th>Item</th><th class="price">Catalog ₹</th><th class="price">Eff. ₹/person</th><th>Fit?</th></tr></thead><tbody>';

    info.priced.forEach(item=>{
      if(item.price==null){
        h+='<tr><td>'+esc(item.displayName)+'</td><td class="price" colspan="3" style="color:var(--muted)">no price</td></tr>';
        return;
      }
      let eff;
      if(info.type==='individual')eff=item.price;
      else if(info.type==='party')eff=item.price/info.sharing;
      else eff=item.price;
      eff=Math.round(eff);

      // fit: compare item's effective contribution to sectionBudget
      // for individual: if item is in top `choices`, it contributes; flag if it alone > sectionBudget
      // for party/fixed: effective eff vs sectionBudget
      const ratio=eff/sectionBudget;
      let fitCls,fitLabel;
      if(ratio<=0.5){fitCls='fit-ok';fitLabel='✓ ok';}
      else if(ratio<=0.9){fitCls='fit-warn';fitLabel='~ watch';}
      else{fitCls='fit-over';fitLabel='✗ high';}

      // for individual mode, only the top `choices` items actually get chosen — mark unchosen items
      const sortedPrices=info.priced.filter(x=>x.price!=null).map(x=>x.price).sort((a,b)=>b-a);
      const threshold=sortedPrices[info.choices-1]??-Infinity;
      const likelyChosen=info.type==='individual'?(item.price>=threshold):true;
      const rowStyle=(!likelyChosen&&info.type==='individual')?'opacity:.5':'';

      h+='<tr style="'+rowStyle+'"><td>'+esc(item.displayName)+((!likelyChosen&&info.type==='individual')?'<span style="font-size:10px;color:var(--muted);margin-left:4px">(not in top '+info.choices+')</span>':'')+'</td>';
      h+='<td class="price">₹'+item.price+'</td>';
      h+='<td class="price">₹'+eff+'</td>';
      h+='<td class="'+fitCls+'">'+fitLabel+'</td></tr>';
    });

    h+='</tbody></table></div>';
  });

  $('#pkgmain').innerHTML=h;
}

// price analyser interactions
$('#pkgmain').addEventListener('change',e=>{
  if(e.target.id==='pa-pkg'){priceAnPkg=e.target.value;renderPriceAnalyser();return;}
});
$('#pkgmain').addEventListener('input',e=>{

  paOverrides[key][e.target.dataset.ov]=+e.target.value||1;
  renderPriceAnalyser();
});

// ===== Autocomplete for displayName fields =====
const acDrop=document.getElementById('ac-drop');
let acTarget=null;

function acSearch(q){
  if(!DATA)return[];
  q=(q||'').toLowerCase().trim();
  const groups=[];
  DATA.menu.groups.forEach(g=>{
    const cats=DATA.menu.categories.filter(c=>c.groupId===g.id);
    cats.forEach(cat=>{
      const rows=[];
      DATA.menu.items.filter(i=>i.categoryId===cat.id).forEach(it=>{
        if(it.variants&&it.variants.length){
          it.variants.forEach(v=>{const label=it.name+' – '+v.name;if(!q||label.toLowerCase().includes(q))rows.push(label);});
        }else{if(!q||it.name.toLowerCase().includes(q))rows.push(it.name);}
      });
      if(rows.length)groups.push({label:g.name+' › '+cat.name,rows});
    });
  });
  return groups;
}

function showAc(inp){
  acTarget=inp;
  const groups=acSearch(inp.value);
  if(!groups.length){hideAc();return;}
  let h='',total=0;
  for(const g of groups){
    if(total>=24)break;
    h+='<div class="ac-group">'+esc(g.label)+'</div>';
    for(const nm of g.rows){
      if(total>=24)break;
      h+='<div class="ac-item" data-acval="'+esc(nm)+'">'+esc(nm)+'</div>';
      total++;
    }
  }
  acDrop.innerHTML=h;
  const r=inp.getBoundingClientRect();
  acDrop.style.cssText='display:block;left:'+r.left+'px;top:'+(r.bottom+3)+'px;width:'+Math.max(r.width,260)+'px';
}
function hideAc(){acDrop.style.display='none';acTarget=null;}

document.addEventListener('input',e=>{
  const t=e.target;
  if((t.dataset.itf==='displayName'||t.dataset.citf==='displayName')&&DATA)showAc(t);
});
document.addEventListener('focusin',e=>{
  const t=e.target;
  if((t.dataset.itf==='displayName'||t.dataset.citf==='displayName')&&DATA)showAc(t);
});
document.addEventListener('focusout',()=>setTimeout(hideAc,160));

acDrop.addEventListener('mousedown',e=>{
  e.preventDefault();
  const item=e.target.closest('[data-acval]');
  if(!item||!acTarget)return;
  acTarget.value=item.dataset.acval;
  acTarget.dispatchEvent(new Event('input',{bubbles:true}));
  hideAc();
});

// ===== Item picker popup =====
let pickerCtx=null;

let pickerActiveCats=new Set();

function openPicker(pkg,sectionIdx,onDone){
  pickerCtx={pkg,sectionIdx,onDone:onDone||renderPrint};
  const sname=(pkg.sections[sectionIdx]||{}).name||'section';
  document.getElementById('picker-title').textContent='Add to: '+sname;
  document.getElementById('picker-q').value='';
  pickerActiveCats=new Set();
  renderPickerChips();
  renderPickerBody('');
  document.getElementById('picker-overlay').style.display='flex';
  setTimeout(()=>document.getElementById('picker-q').focus(),40);
}

// chips to filter the picker list down to one or more categories
function renderPickerChips(){
  let h='<div class="tmpl-chips">';
  DATA.menu.groups.forEach(g=>{
    const cats=DATA.menu.categories.filter(c=>c.groupId===g.id);
    if(!cats.length)return;
    h+='<span class="tc-label">'+esc(g.name)+':</span>';
    cats.forEach(cat=>{
      const active=pickerActiveCats.has(cat.id)?' active':'';
      h+='<button type="button" class="tc'+active+'" data-cat="'+esc(cat.id)+'">'+esc(cat.name)+'</button>';
    });
  });
  h+='</div>';
  document.getElementById('picker-chips').innerHTML=h;
  document.getElementById('picker-chips').querySelectorAll('[data-cat]').forEach(b=>{
    b.addEventListener('click',()=>{
      const id=b.dataset.cat;
      if(pickerActiveCats.has(id))pickerActiveCats.delete(id);else pickerActiveCats.add(id);
      renderPickerChips();
      renderPickerBody(document.getElementById('picker-q').value);
    });
  });
}

function renderPickerBody(q){
  if(!pickerCtx)return;
  const s=pickerCtx.pkg.sections[pickerCtx.sectionIdx];
  const already=new Set((s.items||[]).flatMap(it=>(it.refs||[]).map(r=>r.itemId+'::'+(r.variantId||''))));
  q=(q||'').toLowerCase().trim();
  let h='',checked=0;
  DATA.menu.groups.forEach(g=>{
    let cats=DATA.menu.categories.filter(c=>c.groupId===g.id);
    if(pickerActiveCats.size)cats=cats.filter(c=>pickerActiveCats.has(c.id));
    cats.forEach(cat=>{
      const rows=[];
      DATA.menu.items.filter(i=>i.categoryId===cat.id).forEach(it=>{
        if(it.variants&&it.variants.length){
          it.variants.forEach(v=>{
            const label=it.name+' – '+v.name;
            if(!q||label.toLowerCase().includes(q)){
              const key=it.id+'::'+v.id;
              const ad=already.has(key);
              rows.push({key,iid:it.id,vid:v.id,label,ad});
            }
          });
        }else{
          const label=it.name;
          if(!q||label.toLowerCase().includes(q)){
            const key=it.id+'::';
            const ad=already.has(key);
            rows.push({key,iid:it.id,vid:'',label,ad});
          }
        }
      });
      if(rows.length){
        h+='<div class="picker-group" id="pg-'+esc(cat.id)+'">'+esc(g.name+' › '+cat.name)+'</div>';
        rows.forEach(r=>{
          const chk=r.ad?'checked':'';
          if(r.ad)checked++;
          h+='<label class="picker-row"><input type="checkbox" data-pk="'+esc(r.key)+'" data-iid="'+esc(r.iid)+'" data-vid="'+esc(r.vid)+'" '+chk+'>'+
            '<span class="pr-name">'+esc(r.label)+'</span>'+
            (r.ad?'<span class="pr-added">already added</span>':'')+
            '</label>';
        });
      }
    });
  });
  document.getElementById('picker-body').innerHTML=h||'<div style="padding:20px 18px;color:var(--muted);font-size:13px">No items match.</div>';
  updatePickerCount();
}

function updatePickerCount(){
  const n=document.querySelectorAll('#picker-body input[type=checkbox]:checked').length;
  document.getElementById('picker-count').textContent=n?n+' selected':'';
}

document.getElementById('picker-body').addEventListener('change',e=>{
  if(e.target.type==='checkbox')updatePickerCount();
});

document.getElementById('picker-q').addEventListener('input',e=>renderPickerBody(e.target.value));

document.getElementById('picker-cancel').addEventListener('click',()=>{
  document.getElementById('picker-overlay').style.display='none';
  pickerCtx=null;
});

document.getElementById('picker-done').addEventListener('click',()=>{
  if(!pickerCtx)return;
  const s=pickerCtx.pkg.sections[pickerCtx.sectionIdx];
  const already=new Set((s.items||[]).flatMap(it=>(it.refs||[]).map(r=>r.itemId+'::'+(r.variantId||''))));
  document.querySelectorAll('#picker-body input[type=checkbox]:checked').forEach(cb=>{
    const key=cb.dataset.pk;
    if(already.has(key))return;
    const itemId=cb.dataset.iid,variantId=cb.dataset.vid||null;
    s.items.push({refs:[{itemId,variantId}],displayName:nameFor(itemId,variantId),note:'',badge:''});
    already.add(key);
  });
  setDirty();
  document.getElementById('picker-overlay').style.display='none';
  const cb=pickerCtx.onDone;
  pickerCtx=null;
  cb();
});

document.getElementById('picker-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('picker-overlay')){
    document.getElementById('picker-overlay').style.display='none';
    pickerCtx=null;
  }
});

load();
</script>
